<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b2a4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Gestão Financeira · Sandra Acessórios e Presentes</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2433;--mut:#6b7385;--line:#e3e6ec;--pri:#5b2a4e;--pri2:#7d3d6c;--ok:#1f8a4c;--okbg:#e7f5ec;--warn:#a86a12;--warnbg:#fdf3e1;--bad:#c0392b;--badbg:#fbe9e7;--side:232px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
a{color:var(--pri)}
#side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--pri);color:#fff;padding:18px 12px;overflow:auto;z-index:30;transition:transform .2s}
#side .brand{font-weight:700;font-size:16px;padding:0 8px 4px}
#side .sub{font-size:12px;opacity:.75;padding:0 8px 14px}
#side nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;color:#fff;padding:10px 10px;border-radius:8px;cursor:pointer;opacity:.85}
#side nav button:hover{background:rgba(255,255,255,.1);opacity:1}
#side nav button.on{background:rgba(255,255,255,.18);opacity:1;font-weight:600}
#side .foot{margin-top:18px;padding:10px;font-size:12px;opacity:.8;border-top:1px solid rgba(255,255,255,.2)}
#side .foot button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;margin-top:6px}
.navsec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;padding:14px 10px 4px}
#comWrap{margin-left:var(--side)}
#comFrame{display:block;width:100%;height:calc(100vh - 66px);border:0;background:#fff}
@media(max-width:860px){#comWrap{margin-left:0}#comFrame{height:calc(100vh - 62px)}}
.pill{background:#fff;color:var(--bad);border-radius:20px;font-size:11px;font-weight:700;padding:1px 7px}
#top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 22px 10px;margin-left:var(--side)}
#top h1{font-size:20px;margin:0;flex:1}
#menuBtn{display:none;background:var(--pri);color:#fff;border:0;border-radius:8px;width:40px;height:40px;font-size:20px;cursor:pointer}
#main{margin-left:var(--side);padding:4px 22px 60px;max-width:1300px}
#shade{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px}
.card h3{font-size:14px;margin:14px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:default}
.kpi[onclick]{cursor:pointer}
.kpi .l{font-size:12px;color:var(--mut)}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}.kpi.warn .v{color:var(--warn)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--pri2)}
.btn.sec{background:#fff;color:var(--pri);border:1px solid var(--line)}
.btn.sm{padding:5px 9px;font-size:13px;font-weight:500}
.btn.ok{background:var(--ok)}.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--line)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
.bar input,.bar select{width:auto}
textarea{min-height:80px;resize:vertical}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0}
td.empty{color:var(--mut);text-align:center;padding:20px}
tr.vencida td{background:var(--badbg)}
.acts{white-space:nowrap;text-align:right}
.acts .btn{margin-left:4px}
.tag{display:inline-block;font-size:12px;border-radius:20px;padding:2px 9px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-bad{background:var(--badbg);color:var(--bad)}.t-mut{background:#eef0f4;color:var(--mut)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;margin-bottom:8px;cursor:pointer}
.alert.alto{background:var(--badbg)}.alert.medio{background:var(--warnbg)}
.alert b{min-width:60px;font-size:12px;text-transform:uppercase}
.alert.alto b{color:var(--bad)}.alert.medio b{color:var(--warn)}
.muted{color:var(--mut);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:10px;border-bottom:1px solid var(--line)}
.chart div{flex:1;border-radius:4px 4px 0 0;position:relative;min-height:2px}
.chart div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut);white-space:nowrap}
#modal{display:none;position:fixed;inset:0;background:rgba(20,20,30,.45);z-index:50;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
#modal .box{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:20px}
#modal h2{margin:0 0 14px;font-size:18px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg label{display:block;font-size:13px;color:var(--mut)}
.fg label>span{display:block;margin-bottom:4px}
.fg .full{grid-column:1/-1}
.fg label.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
.fg label.chk input{width:auto}
.prev{margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:14px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
#login .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;width:100%;max-width:360px}
#login h1{font-size:19px;margin:0 0 4px}
#login input{margin-top:10px}
#login .btn{width:100%;margin-top:14px}
.demo{background:var(--warnbg);color:var(--warn);font-size:13px;padding:8px 12px;border-radius:8px;margin-bottom:14px}
.printonly{display:none}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;z-index:60;display:none;font-size:14px}
.dre td:first-child{padding-left:8px}.dre tr.sub td{font-weight:700;background:#fafbfc}.dre tr.ind td:first-child{padding-left:24px;color:var(--mut)}
@media(max-width:860px){
  #side{transform:translateX(-100%)}
  body.menu #side{transform:none}
  body.menu #shade{display:block}
  #top,#main{margin-left:0}
  #top{padding:12px 14px 8px}
  #main{padding:4px 14px 60px}
  #menuBtn{display:block}
  .grid2{grid-template-columns:1fr}
}
@media(max-width:640px){
  .fg{grid-template-columns:1fr}
  .tw table,.tw thead,.tw tbody,.tw tfoot,.tw tr,.tw td{display:block}
  .tw thead{display:none}
  .tw tr{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:6px 10px}
  .tw tr.vencida{border-color:var(--bad)}
  .tw tr.vencida td{background:none}
  .tw td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 0;text-align:right}
  .tw td::before{content:attr(data-l);color:var(--mut);font-size:12px;text-align:left}
  .tw td.empty::before{content:none}
  .tw td.acts{justify-content:flex-end;padding-top:8px}
  .tw td.acts::before{content:none}
  .kpi .v{font-size:18px}
  #modal{padding:0}
  #modal .box{border-radius:0;min-height:100vh}
}
@media print{
  #side,#top,.noprint,#shade{display:none!important}
  #main{margin:0;padding:0}
  .printonly{display:block;white-space:pre-wrap}
  .card{break-inside:avoid;border:0;padding:6px 0}
  body{background:#fff}
}
</style>
</head>
<body>

<div id="login">
  <form class="box" onsubmit="event.preventDefault();entrar()">
    <h1>Gestão Financeira</h1>
    <div class="muted">Sandra Acessórios e Presentes</div>
    <input id="lgEmail" type="email" placeholder="E-mail" autocomplete="username" required>
    <input id="lgSenha" type="password" placeholder="Senha" autocomplete="current-password" required>
    <button class="btn">Entrar</button>
    <div id="lgErro" class="muted" style="color:var(--bad);margin-top:10px"></div>
    <div style="text-align:center;margin-top:12px"><a href="#" onclick="event.preventDefault();esqueciSenha()" class="muted">Esqueci minha senha / primeiro acesso</a></div>
  </form>
</div>

<div id="app" style="display:none">
  <aside id="side">
    <div class="brand">Sandra Acessórios</div>
    <div class="sub">Gestão Administrativo-Financeira</div>
    <nav id="nav"></nav>
    <div class="foot"><div id="userInfo"></div><button onclick="sair()">Sair</button></div>
  </aside>
  <div id="shade" onclick="document.body.classList.remove('menu')"></div>
  <header id="top"><button id="menuBtn" onclick="document.body.classList.toggle('menu')">☰</button><h1 id="title"></h1></header>
  <main id="main"></main>
  <div id="comWrap" style="display:none"><iframe id="comFrame" title="Comissões e salários"></iframe></div>
</div>

<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =====================================================================
   CONFIGURAÇÃO DO FIREBASE (mesmo projeto do app de comissões)
   Os dados financeiros ficam em financeiro/loja/... e a folha é LIDA
   (nunca alterada) do documento dados/principal do app de comissões.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCNVD_PpYJ0yc1nnkMNwg80hJa9jhryIvk",
  authDomain: "salarios-sandra-acessorios.firebaseapp.com",
  projectId: "salarios-sandra-acessorios",
  storageBucket: "salarios-sandra-acessorios.firebasestorage.app",
  messagingSenderId: "929960542240",
  appId: "1:929960542240:web:d9e0b655f806aa27197c45"
};
// Modo demonstração: abra o arquivo com ?demo no endereço para testar sem mexer nos dados reais.

/* ============================ UTILITÁRIOS ============================ */
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (s, n) => { const d = new Date(s + 'T12:00:00'); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return iso(d); };
const diffDays = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const weekday = s => new Date(s + 'T12:00:00').getDay();
const br = s => { if (!s) return '—'; const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y.slice(2); };
const mesAtual = () => today().slice(0, 7);
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const mesNome = m => { const [y, mm] = m.split('-'); return MESES[+mm - 1] + '/' + y; };
const prevMonth = m => addMonths(m + '-01', -1).slice(0, 7);
const lastDay = m => { const [y, mm] = m.split('-').map(Number); return m + '-' + pad(new Date(y, mm, 0).getDate()); };
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmt = v => BRL.format(v || 0);
const pct = v => (isFinite(v) ? (v * 100).toFixed(1).replace('.', ',') : '0,0') + '%';
const cls = v => v < -0.005 ? 'neg' : (v > 0.005 ? 'pos' : '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sum = (arr, f) => arr.reduce((a, x) => a + (f(x) || 0), 0);
function num(v) {
  if (typeof v === 'number') return v;
  v = String(v ?? '').trim().replace(/[R$\s]/g, '');
  if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g, '');
  const n = parseFloat(v); return isNaN(n) ? 0 : Math.round(n * 100) / 100;
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2600); }

/* ============================ DADOS ============================ */
const COLS = ['caixa', 'pagar', 'receber', 'estoque', 'perdas', 'pendencias', 'notas', 'config'];
const S = Object.fromEntries(COLS.map(c => [c, []]));
const DEMO = String(firebaseConfig.apiKey).includes('COLE') || location.search.includes('demo') || location.protocol === 'file:';
let db = null, auth = null;
const LS = 'sandra_fin_demo_v1';

let FOLHA = null; // conteúdo de dados/principal (app de comissões), somente leitura
const Store = {
  ref(col) { return db.collection('financeiro').doc('loja').collection(col); },
  persistLocal() { localStorage.setItem(LS, JSON.stringify(S)); },
  async save(col, obj) {
    if (!obj.id) obj.id = uid();
    obj.atualizadoEm = new Date().toISOString();
    const clean = JSON.parse(JSON.stringify(obj));
    if (DEMO) {
      const i = S[col].findIndex(x => x.id === obj.id);
      if (i >= 0) S[col][i] = clean; else S[col].push(clean);
      this.persistLocal(); render();
    } else {
      await this.ref(col).doc(obj.id).set(clean);
    }
    return obj;
  },
  async del(col, id) {
    if (DEMO) { S[col] = S[col].filter(x => x.id !== id); this.persistLocal(); render(); }
    else await this.ref(col).doc(id).delete();
  },
  start() {
    if (DEMO) {
      try { const d = JSON.parse(localStorage.getItem(LS) || '{}'); COLS.forEach(c => S[c] = d[c] || []); } catch (e) { }
      render(); return;
    }
    db.collection('dados').doc('principal').onSnapshot(d => { FOLHA = d.exists ? d.data() : null; render(); },
      err => { console.error(err); FOLHA = { erro: err.code }; render(); });
    COLS.forEach(c => this.ref(c).onSnapshot(snap => {
      S[c] = snap.docs.map(d => ({ id: d.id, ...d.data() })); render();
    }, err => { console.error(err); toast('Erro de permissão no Firestore (' + c + '). Veja as regras.'); }));
  }
};

/* ============================ CONFIGURAÇÕES ============================ */
const CATEGORIAS_PADRAO = ['Mercadoria', 'Folha de pagamento', 'Encargos e impostos', 'Pró-labore', 'Aluguel e condomínio', 'Energia, água e internet', 'Taxas bancárias', 'Contabilidade', 'Marketing', 'Manutenção', 'Material de uso e consumo', 'Outros'];
const DEF = { saldoBanco: 0, saldoBancoData: today(), tolerancia: 5, alcada: 1000, taxaDebito: 1.5, taxaCredito: 3.5, taxaPix: 0, prazoDebito: 1, prazoCredito: 30, prazoPix: 0, diasParado: 90, cmvPercent: 50, diaPagFolha: 5, diaInss: 20, vendasEstimadas: false, diasFechados: '0', categorias: CATEGORIAS_PADRAO, orcamento: {} };
function cfg() {
  const c = S.config.find(x => x.id === 'geral') || {};
  const o = { ...DEF, ...c, orcamento: { ...(c.orcamento || {}) } };
  if (!Array.isArray(o.categorias) || !o.categorias.length) o.categorias = CATEGORIAS_PADRAO;
  return o;
}
const fechados = () => String(cfg().diasFechados || '').split(',').map(s => s.trim()).filter(s => s !== '').map(Number);

/* ============================ CÁLCULOS ============================ */
function cx(c) {
  const vendas = (c.dinheiro || 0) + (c.pix || 0) + (c.debito || 0) + (c.credito || 0) + (c.outros || 0);
  const esperado = (c.fundoInicial || 0) + (c.dinheiro || 0) + (c.suprimentos || 0) - (c.sangrias || 0);
  const dif = (c.contado == null) ? 0 : (c.contado || 0) - esperado;
  return { vendas, esperado, dif };
}
function mediaDiariaLiquida() {
  const C = cfg(), t = today(), ini = addDays(t, -28);
  const xs = S.caixa.filter(c => c.data >= ini && c.data < t);
  if (!xs.length) return 0;
  const liq = sum(xs, c => (c.dinheiro || 0) + (c.outros || 0) + (c.pix || 0) * (1 - C.taxaPix / 100) + (c.debito || 0) * (1 - C.taxaDebito / 100) + (c.credito || 0) * (1 - C.taxaCredito / 100));
  return liq / xs.length;
}
function fluxo(extra = []) {
  const C = cfg(), t = today(), N = 91, F = fechados();
  const dias = Array.from({ length: N }, (_, i) => ({ d: addDays(t, i), ent: 0, sai: 0, est: 0 }));
  const idx = d => { if (!d) return 0; const k = diffDays(t, d); return k < 0 ? 0 : (k >= N ? -1 : k); };
  S.receber.filter(r => r.status === 'previsto').forEach(r => { const k = idx(r.dataPrevista); if (k >= 0) dias[k].ent += r.liquido || 0; });
  S.pagar.filter(p => p.status !== 'pago').forEach(p => { const k = idx(p.vencimento); if (k >= 0) dias[k].sai += p.valor || 0; });
  extra.forEach(e => { const k = idx(e.d); if (k >= 0) dias[k].sai += e.v; });
  const md = C.vendasEstimadas ? mediaDiariaLiquida() * (1 - C.cmvPercent / 100) : 0;
  const caixaHoje = S.caixa.some(c => c.data === t);
  if (md) dias.forEach((x, i) => { if ((i > 0 || !caixaHoje) && !F.includes(weekday(x.d))) x.est = md; });
  let saldo = C.saldoBanco || 0, min = { v: Infinity, d: t };
  dias.forEach(x => { saldo += x.ent + x.est - x.sai; x.saldo = saldo; if (saldo < min.v) min = { v: saldo, d: x.d }; });
  const semanas = [];
  for (let w = 0; w < 13; w++) {
    const ds = dias.slice(w * 7, w * 7 + 7);
    semanas.push({ ini: ds[0].d, fim: ds[ds.length - 1].d, ent: sum(ds, x => x.ent), est: sum(ds, x => x.est), sai: sum(ds, x => x.sai), saldo: ds[ds.length - 1].saldo });
  }
  return { dias, semanas, min, md, saldoIni: C.saldoBanco || 0 };
}
function dre(m) {
  const C = cfg();
  const cxs = S.caixa.filter(c => (c.data || '').startsWith(m));
  const bruta = sum(cxs, c => cx(c).vendas);
  const taxas = sum(cxs, c => ((c.debito || 0) * C.taxaDebito + (c.credito || 0) * C.taxaCredito + (c.pix || 0) * C.taxaPix) / 100);
  const liquida = bruta - taxas;
  const cmv = bruta * C.cmvPercent / 100;
  const lb = liquida - cmv;
  const pagos = S.pagar.filter(p => p.status === 'pago' && (p.dataPagamento || '').startsWith(m));
  const desp = {};
  pagos.filter(p => p.categoria !== 'Mercadoria').forEach(p => { const k = p.categoria || 'Outros'; desp[k] = (desp[k] || 0) + (p.valorPago ?? p.valor ?? 0); });
  const perdas = sum(S.perdas.filter(p => (p.data || '').startsWith(m)), p => p.valor);
  const totDesp = sum(Object.values(desp), v => v) + perdas;
  const compras = sum(pagos.filter(p => p.categoria === 'Mercadoria'), p => p.valorPago ?? p.valor);
  return { bruta, taxas, liquida, cmv, lb, desp, perdas, totDesp, res: lb - totDesp, compras, dias: cxs.length };
}
function statusEstoque(e) {
  const C = cfg();
  if ((e.qtd || 0) <= 0) return ['Ruptura', 't-bad'];
  if (e.minimo != null && e.qtd <= e.minimo) return ['Repor', 't-warn'];
  if (!e.ultimaVenda || diffDays(e.ultimaVenda, today()) > C.diasParado) return ['Parado', 't-warn'];
  return ['OK', 't-ok'];
}

/* ============================ ALERTAS ============================ */
function lista(xs, f, n = 4) { const s = xs.slice(0, n).map(f).join('; '); return xs.length > n ? s + ` e mais ${xs.length - n}` : s; }
function alertas() {
  const C = cfg(), t = today(), A = [], F = fechados();
  const fech = new Set(S.caixa.map(c => c.data));
  const semFech = []; for (let i = 1; i <= 7; i++) { const d = addDays(t, -i); if (!F.includes(weekday(d)) && !fech.has(d)) semFech.push(d); }
  if (semFech.length) A.push({ n: 'alto', t: `Caixa sem fechamento lançado: ${semFech.map(br).join(', ')}`, v: 'caixa' });
  const naoConf = S.caixa.filter(c => c.status !== 'conferido' && c.data < t).sort((a, b) => a.data.localeCompare(b.data));
  if (naoConf.length) A.push({ n: 'medio', t: `${naoConf.length} fechamento(s) de caixa aguardando conferência: ${lista(naoConf, c => br(c.data))}`, v: 'caixa' });
  const difs = S.caixa.filter(c => c.status !== 'conferido' && Math.abs(cx(c).dif) > C.tolerancia);
  if (difs.length) A.push({ n: 'alto', t: `Diferença de caixa acima da tolerância: ${lista(difs, c => br(c.data) + ' ' + fmt(cx(c).dif))}`, v: 'caixa' });
  const abertas = S.pagar.filter(p => p.status !== 'pago');
  const venc = abertas.filter(p => p.vencimento < t);
  if (venc.length) A.push({ n: 'alto', t: `${venc.length} conta(s) vencida(s) sem pagamento, total ${fmt(sum(venc, p => p.valor))}`, v: 'pagar' });
  const semAut = abertas.filter(p => p.vencimento <= addDays(t, 7) && (p.valor || 0) > C.alcada && !p.autorizado);
  if (semAut.length) A.push({ n: 'alto', t: `${semAut.length} conta(s) acima da alçada (${fmt(C.alcada)}) vencendo em até 7 dias sem autorização da direção: ${lista(semAut, p => esc(p.fornecedor) + ' ' + fmt(p.valor))}`, v: 'pagar' });
  const semDoc = abertas.filter(p => p.vencimento >= t && p.vencimento <= addDays(t, 3) && !p.docConferido);
  if (semDoc.length) A.push({ n: 'medio', t: `${semDoc.length} conta(s) vencendo em até 3 dias com documento não conferido`, v: 'pagar' });
  const atras = S.receber.filter(r => r.status === 'previsto' && r.dataPrevista < t);
  if (atras.length) A.push({ n: 'medio', t: `${atras.length} recebível(is) com data prevista vencida e sem baixa, total ${fmt(sum(atras, r => r.liquido))}. Confira o extrato.`, v: 'receber' });
  const div = S.receber.filter(r => r.status === 'divergente');
  if (div.length) A.push({ n: 'alto', t: `${div.length} recebível(is) com divergência de valor`, v: 'receber' });
  const pend = S.pendencias.filter(p => p.status !== 'resolvida' && p.prazo && p.prazo < t);
  if (pend.length) A.push({ n: 'alto', t: `${pend.length} pendência(s) com prazo vencido: ${lista(pend, p => esc(p.titulo))}`, v: 'pendencias' });
  if (diffDays(C.saldoBancoData || t, t) > 7) A.push({ n: 'medio', t: `Saldo bancário desatualizado (último em ${br(C.saldoBancoData)}). Atualize para o fluxo de caixa ficar confiável.`, v: 'config' });
  const f = fluxo();
  if (f.min.v < 0) A.push({ n: 'alto', t: `Fluxo projeta saldo negativo de ${fmt(f.min.v)} em ${br(f.min.d)}`, v: 'fluxo' });
  const sv = semanasVendas(prevMonth(mesAtual())).concat(semanasVendas(mesAtual())).filter(w => w.completo && w.dif > Math.max(C.tolerancia, w.caixa * 0.005));
  if (sv.length) A.push({ n: 'alto', t: `Vendas lançadas nas comissões maiores que o caixa: ${lista(sv, w => br(w.ini) + ' a ' + br(w.fim) + ' (+' + fmt(w.dif) + ')')}. Conferir antes de pagar comissão.`, v: 'folha' });
  const rup = S.estoque.filter(e => statusEstoque(e)[0] === 'Ruptura');
  if (rup.length) A.push({ n: 'medio', t: `${rup.length} item(ns) de estoque em ruptura: ${lista(rup, e => esc(e.produto))}`, v: 'estoque' });
  return A.sort((a, b) => (a.n === 'alto' ? 0 : 1) - (b.n === 'alto' ? 0 : 1));
}

function openForm({ title, fields, data = {}, onSave, preview, saveLabel = 'Salvar' }) {

function collect() {

async function salvarCaixa(c) {
  const dup = S.caixa.find(x => x.data === c.data && x.id !== c.id && (x.operador || '') === (c.operador || ''));
  if (dup && !confirm(`Já existe um fechamento em ${br(c.data)} para este operador. Salvar mesmo assim?`)) return false;
  if (c.status === 'conferido' && !c.conferidoEm) c.conferidoEm = new Date().toISOString();
  await Store.save('caixa', c);
  const C = cfg();
  if (c.gerarRecebiveis) {
    for (const r of S.receber.filter(r => r.caixaId === c.id && r.status === 'previsto')) await Store.del('receber', r.id);
    const jaBaixado = o => S.receber.some(r => r.caixaId === c.id && r.origem === o && r.status !== 'previsto');
    const mk = async (origem, valor, taxaPct, prazo) => {
      if (!valor || jaBaixado(origem)) return;
      const taxa = Math.round(valor * taxaPct) / 100;
      await Store.save('receber', { origem, descricao: `Vendas ${origem.toUpperCase()} do caixa ${br(c.data)}${c.operador ? ' (' + c.operador + ')' : ''}`, dataPrevista: addDays(c.data, prazo), bruto: valor, taxa, liquido: Math.round((valor - taxa) * 100) / 100, status: 'previsto', caixaId: c.id });
    };
    await mk('pix', c.pix, C.taxaPix, C.prazoPix);
    await mk('debito', c.debito, C.taxaDebito, C.prazoDebito);
    await mk('credito', c.credito, C.taxaCredito, C.prazoCredito);
  }
  const d = cx(c).dif;
  if (Math.abs(d) > C.tolerancia && !S.pendencias.some(p => p.origemId === c.id && p.status !== 'resolvida')) {
    await Store.save('pendencias', { data: today(), titulo: `Apurar diferença de caixa de ${fmt(d)} em ${br(c.data)}${c.operador ? ' (' + c.operador + ')' : ''}`, origem: 'Caixa', origemId: c.id, responsavel: c.operador || '', prazo: addDays(today(), 2), status: 'aberta' });
  }
}

    ${kpi('Diferença acumulada', tot(c => cx(c).dif), `tolerância diária ${fmt(C.tolerancia)}`, Math.abs(sum(xs, c => cx(c).dif)) > C.tolerancia ? 'bad' : 'ok')}

  <div class="muted">Diferença = dinheiro contado − (fundo inicial + vendas em dinheiro + suprimentos − sangrias). Diferenças acima da tolerância geram pendência automaticamente. Ao salvar, PIX e cartões viram recebíveis para você conciliar com o extrato.</div>`;

function novaConta(id, pre = {}) {
  const data = id ? { ...S.pagar.find(p => p.id === id) } : { categoria: 'Outros', ...pre };

    title: id ? 'Editar conta a pagar' : 'Nova conta a pagar', fields: PAGAR_FIELDS(!id), data,

function pagarConta(id) {
  const p = S.pagar.find(x => x.id === id), C = cfg();
  if ((p.valor || 0) > C.alcada && !p.autorizado) { alert(`Esta conta (${fmt(p.valor)}) está acima da sua alçada de ${fmt(C.alcada)}.\nMarque "Autorizado pela direção" no cadastro depois de obter a autorização da Sandra.`); return; }

    preview: v => { const d = (v.valorPago || 0) - (p.valor || 0); return Math.abs(d) > 0.005 ? `Diferença em relação ao valor original: <b class="${cls(-d)}">${fmt(d)}</b> (${d > 0 ? 'juros/multa' : 'desconto'})` : 'Valor igual ao original.'; },
    onSave: v => Store.save('pagar', { ...p, ...v, status: 'pago' })
  });
}
async function estornarConta(id) { const p = S.pagar.find(x => x.id === id); if (confirm('Desfazer a baixa deste pagamento?')) await Store.save('pagar', { ...p, status: 'aberto', dataPagamento: '', valorPago: null }); }
R.pagar = () => {
  const t = today(), st = F.pagarStatus, m = F.pagarMes, C = cfg();
  let xs = S.pagar.filter(p => st === 'todas' || (st === 'pagas' ? p.status === 'pago' : p.status !== 'pago'));
  if (m) xs = xs.filter(p => (st === 'pagas' ? (p.dataPagamento || '') : (p.vencimento || '')).startsWith(m));
  xs.sort((a, b) => (a.vencimento || '').localeCompare(b.vencimento || ''));
  if (st === 'pagas') xs.reverse();
  const rows = xs.map(p => {
    const pago = p.status === 'pago', vencida = !pago && p.vencimento < t;
    const acima = (p.valor || 0) > C.alcada;
    const chk = `${p.docConferido ? tag('Doc ✓', 't-ok') : tag('Doc ✗', 't-mut')} ${acima ? (p.autorizado ? tag('Aut ✓', 't-ok') : tag('Aut ✗', 't-warn')) : ''}`;
    const s = pago ? tag('Pago ' + br(p.dataPagamento), 't-ok') : vencida ? tag(`Vencida há ${diffDays(p.vencimento, t)}d`, 't-bad') : p.status === 'programado' ? tag('Programado', 't-mut') : tag(p.vencimento === t ? 'Vence hoje' : `Em ${diffDays(t, p.vencimento)}d`, 't-warn');
    const r = [br(p.vencimento), `<b>${esc(p.fornecedor)}</b>${p.descricao ? `<br><span class="muted">${esc(p.descricao)}</span>` : ''}`, esc(p.categoria || ''), fmt(pago ? (p.valorPago ?? p.valor) : p.valor), chk, s,
      `${pago ? `<button class="btn sm sec" onclick="estornarConta('${p.id}')">Desfazer</button>` : `<button class="btn sm ok" onclick="pagarConta('${p.id}')">Pagar</button>`}<button class="btn sm sec" onclick="novaConta('${p.id}')">Editar</button><button class="btn sm danger" onclick="excluir('pagar','${p.id}','esta conta')">×</button>`];
    if (vencida) r.cls = 'vencida'; return r;
  });
  const ab = S.pagar.filter(p => p.status !== 'pago');
  const periodo = d => sum(ab.filter(p => p.vencimento <= addDays(t, d)), p => p.valor);
  return `
  <div class="kpis">
    ${kpi('Vencidas', fmt(sum(ab.filter(p => p.vencimento < t), p => p.valor)), '', ab.some(p => p.vencimento < t) ? 'bad' : 'ok')}
    ${kpi('Até 7 dias', fmt(periodo(7)))}${kpi('Até 30 dias', fmt(periodo(30)))}${kpi('Total em aberto', fmt(sum(ab, p => p.valor)), ab.length + ' conta(s)')}
  </div>
  <div class="bar">
    <select onchange="F.pagarStatus=this.value;render()">${[['abertas', 'Em aberto'], ['pagas', 'Pagas'], ['todas', 'Todas']].map(([k, l]) => `<option value="${k}" ${st === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <input type="month" value="${m}" onchange="F.pagarMes=this.value;render()" title="Filtrar por mês">${m ? `<button class="btn sm sec" onclick="F.pagarMes='';render()">Todos os meses</button>` : ''}
    <div class="grow"></div><button class="btn" onclick="novaConta()">+ Conta a pagar</button>
  </div>
  <div class="card">${table(['Vencimento', 'Fornecedor', 'Categoria', N('Valor'), 'Checagens', 'Situação', ACT], rows, xs.length ? ['Total', '', '', fmt(sum(xs, p => p.status === 'pago' ? (p.valorPago ?? p.valor) : p.valor)), '', '', ''] : null)}</div>
  <div class="muted">Sua alçada atual: pagamentos até ${fmt(C.alcada)} sem autorização. Acima disso, o sistema bloqueia a baixa até a conta estar marcada como autorizada pela direção.</div>`;

async function resolverDivergencia(id) { const r = S.receber.find(x => x.id === id); if (confirm('Marcar divergência como resolvida (aceitar o valor recebido)?')) await Store.save('receber', { ...r, status: 'recebido', obs: ((r.obs || '') + ` [Divergência aceita em ${br(today())}]`).trim() }); }
R.receber = () => {

    const row = [br(r.dataPrevista), origemNome(r.origem), esc(r.descricao), fmt(r.bruto), fmt(r.taxa), fmt(r.liquido), s, a + `<button class="btn sm sec" onclick="novoReceber('${r.id}')">Editar</button><button class="btn sm danger" onclick="excluir('receber','${r.id}','este recebível')">×</button>`];

  </div>
  ${porOrig.length ? `<div class="card"><h2>Previsto nos próximos 30 dias por origem</h2>${table(['Origem', N('Líquido')], porOrig.map(([l, v]) => [l, fmt(v)]))}</div>` : ''}
  <div class="bar">
    <select onchange="F.receberStatus=this.value;render()">${[['previsto', 'A receber'], ['divergente', 'Divergentes'], ['recebido', 'Recebidos'], ['todos', 'Todos']].map(([k, l]) => `<option value="${k}" ${st === k ? 'selected' : ''}>${l}</option>`).join('')}</select>

/* ============================ DRE ============================ */
R.dre = () => {
  const m = F.dreMes, C = cfg(), a = dre(m), b = dre(prevMonth(m));
  const pctB = (v, base) => base ? pct(v / base) : '—';
  const L = (nome, va, vb, opt = {}) => { const r = [nome, fmt(va), pctB(va, a.bruta), fmt(vb), opt.orc != null ? fmt(opt.orc) : '', opt.orc != null ? `<span class="${cls(va - opt.orc)}">${fmt(va - opt.orc)}</span>` : '']; r.cls = opt.c || ''; return r; };
  const cats = [...new Set([...Object.keys(a.desp), ...Object.keys(b.desp), ...Object.keys(C.orcamento).filter(k => C.orcamento[k] && k !== 'Mercadoria')])];
  const orcTot = sum(cats, k => C.orcamento[k]);
  const rows = [
    L('Receita bruta de vendas', a.bruta, b.bruta, { c: 'sub' }),
    L('(−) Taxas de cartão e PIX', -a.taxas, -b.taxas, { c: 'ind' }),
    L('= Receita líquida', a.liquida, b.liquida, { c: 'sub' }),
    L(`(−) CMV estimado (${String(C.cmvPercent).replace('.', ',')}% da receita)`, -a.cmv, -b.cmv, { c: 'ind' }),
    L('= Lucro bruto', a.lb, b.lb, { c: 'sub' }),
    ...cats.map(k => L('(−) ' + esc(k), -(a.desp[k] || 0), -(b.desp[k] || 0), { c: 'ind', orc: C.orcamento[k] ? -C.orcamento[k] : null })),
    L('(−) Perdas de estoque', -a.perdas, -b.perdas, { c: 'ind' }),
    L('= Total de despesas', -a.totDesp, -b.totDesp, { c: 'sub', orc: orcTot ? -orcTot : null }),
    L('= Resultado operacional', a.res, b.res, { c: 'sub' })
  ];
  rows.forEach(r => { if (r.cls === 'sub' && r[0].startsWith('= Res')) r[1] = `<span class="${cls(a.res)}">${r[1]}</span>`; });
  const desvios = cats.filter(k => C.orcamento[k] && (a.desp[k] || 0) > C.orcamento[k]).map(k => `${esc(k)}: ${fmt(a.desp[k])} contra orçamento de ${fmt(C.orcamento[k])} (${pct((a.desp[k] - C.orcamento[k]) / C.orcamento[k])} acima)`);
  return `
  <div class="bar"><input type="month" value="${m}" onchange="F.dreMes=this.value;render()"><div class="grow"></div><span class="muted">${a.dias} dia(s) de caixa lançados no mês</span></div>
  <div class="kpis">
    ${kpi('Receita bruta', fmt(a.bruta), b.bruta ? `${pct((a.bruta - b.bruta) / b.bruta)} vs ${mesNome(prevMonth(m))}` : '')}
    ${kpi('Margem bruta', pct(a.bruta ? a.lb / a.bruta : 0))}
    ${kpi('Despesas', fmt(a.totDesp), orcTot ? `orçado ${fmt(orcTot)}` : '', orcTot && a.totDesp > orcTot ? 'bad' : '')}
    ${kpi('Resultado', fmt(a.res), 'margem ' + pct(a.bruta ? a.res / a.bruta : 0), a.res < 0 ? 'bad' : 'ok')}
    ${kpi('Compras de mercadoria pagas', fmt(a.compras), 'impacto no caixa (fora da DRE)')}
  </div>
  ${desvios.length ? `<div class="card"><h2>Desvios de orçamento</h2>${desvios.map(d => `<div class="alert alto" style="cursor:default"><b>Acima</b><div>${d}</div></div>`).join('')}</div>` : ''}
  <div class="card dre"><h2>DRE gerencial · ${mesNome(m)}</h2>
    ${table(['Linha', N(mesNome(m)), N('% receita'), N(mesNome(prevMonth(m))), N('Orçamento'), N('Sobra / estouro')], rows)}
    <p class="muted">Receitas pelo caixa diário (data da venda). Despesas pelas contas pagas no mês (data do pagamento). Compras de mercadoria não entram como despesa: o custo da mercadoria vendida é estimado pelo percentual de CMV das Configurações. Quando houver o custo real por venda, trocamos a estimativa.</p>
  </div>`;
};

/* ============================ FOLHA E COMISSÕES ============================ */
// Cópia fiel das regras do app de comissões (calcSalarioMes), já com a correção:
// a semana pertence ao mês em que começa.
function fComissao(v, m) { if (!m || m <= 0) return 0; const p = v / m * 100; for (const f of [...(FOLHA.faixasCom || [])].sort((a, b) => b.meta - a.meta)) if (p >= f.meta) return v * f.com / 100; return 0; }
function fBonus(v, m) { if (!m || m <= 0) return 0; const p = v / m * 100; for (const f of [...(FOLHA.faixasBonus || [])].sort((a, b) => b.meta - a.meta)) if (p >= f.meta) return f.bonus; return 0; }
function folhaMes(ym) {
  if (!FOLHA || FOLHA.erro) return [];
  return (FOLHA.colaboradores || []).map(col => {
    const lancs = (FOLHA.lancamentos || []).filter(l => l.colId === col.id && (l.dataIni || l.data || '').startsWith(ym));
    let comissao = 0, bonus = 0;
    lancs.forEach(l => { comissao += fComissao(Number(l.vendas) || 0, Number(l.meta) || 0); bonus += fBonus(Number(l.vendas) || 0, Number(l.meta) || 0); });
    const vendas = sum(lancs, l => Number(l.vendas)), vale = sum(lancs, l => Number(l.vale));
    const fixo = Number(col.salario) || 0, cafe = Number(col.cafe) || 0, tempo = Number(col.tempo) || 0;
    const d = (FOLHA.descontosMes || {})[col.id + '_' + ym] || {};
    const he = (Number(d.horasExtras) || 0) * (Number(col.valorHE) || 0);
    const faltas = sum(lancs, l => Number(l.faltasNum)) * fixo / 30;
    const outros = Number(d.outrosDescontos) || 0, inss = Number(col.inss) || 0;
    const base = fixo + comissao + bonus + he + cafe + tempo;
    return { id: col.id, nome: col.nome, semanas: lancs.length, vendas, fixo, comissao, bonus, he, cafe, tempo, faltas, vale, outros, inss, base, liquido: base - inss - vale - faltas - outros };
  }).filter(r => r.semanas || r.fixo);
}
function semanasVendas(ym) {
  if (!FOLHA || FOLHA.erro) return [];
  const map = {};
  (FOLHA.lancamentos || []).filter(l => (l.dataIni || l.data || '').startsWith(ym)).forEach(l => {
    const ini = l.dataIni || l.data, fim = l.dataFim || ini, k = ini + '|' + fim;
    (map[k] = map[k] || { ini, fim, vendas: 0 }).vendas += Number(l.vendas) || 0;
  });
  const F_ = fechados();
  return Object.values(map).sort((a, b) => a.ini.localeCompare(b.ini)).map(w => {
    const cxs = S.caixa.filter(c => c.data >= w.ini && c.data <= w.fim);
    let abertos = 0; for (let d = w.ini; d <= w.fim; d = addDays(d, 1)) if (!F_.includes(weekday(d))) abertos++;
    const dias = new Set(cxs.map(c => c.data)).size;
    const caixa = sum(cxs, c => cx(c).vendas);
    return { ...w, caixa, dif: w.vendas - caixa, dias, abertos, completo: dias >= abertos && w.fim < today() };
  });
}
function vencFolha(ym, dia) { const [y, m] = addMonths(ym + '-01', 1).split('-'); const ld = +lastDay(y + '-' + m).slice(8); return `${y}-${m}-${pad(Math.min(Math.max(1, dia || 1), ld))}`; }

  const base = { categoria: 'Folha de pagamento', status: 'aberto', docConferido: false, autorizado: false, origem: 'folha' };

    ${F.relTipo === 'semanal' ? `<input type="date" value="${F.relRef}" onchange="F.relRef=this.value;render()">` : `<input type="month" value="${F.relMes}" onchange="F.relMes=this.value;render()">`}
    <div class="grow"></div><button class="btn" onclick="window.print()">Imprimir / salvar PDF</button>
  </div>
  <div class="card"><h2 style="font-size:19px">${P.nome}</h2><div class="muted">Sandra Acessórios e Presentes · Gerência Administrativo-Financeira · emitido em ${br(today())}</div></div>
  <div class="kpis">
    ${kpi('Vendas no período', fmt(vendas), `${cxs.length} dia(s) com caixa lançado`)}
    ${kpi('Pagamentos realizados', fmt(sum(pagos, p => p.valorPago ?? p.valor)), pagos.length + ' conta(s)')}
    ${kpi('Recebimentos conciliados', fmt(sum(rec, r => r.valorRecebido ?? r.liquido)), rec.length + ' baixa(s)')}
    ${kpi('Saldo atual informado', fmt(C.saldoBanco), 'em ' + br(C.saldoBancoData))}
    ${kpi('Menor saldo em 90 dias', fmt(f.min.v), 'em ' + br(f.min.d), f.min.v < 0 ? 'bad' : 'ok')}
  </div>
  ${d ? `<div class="card"><h2>Resultado do mês</h2>${table(['Indicador', N(mesNome(F.relMes)), N(mesNome(prevMonth(F.relMes)))], [
    ['Receita bruta', fmt(d.bruta), fmt(dPrev.bruta)], ['Lucro bruto', fmt(d.lb), fmt(dPrev.lb)], ['Margem bruta', pct(d.bruta ? d.lb / d.bruta : 0), pct(dPrev.bruta ? dPrev.lb / dPrev.bruta : 0)],
    ['Despesas totais', fmt(d.totDesp), fmt(dPrev.totDesp)], ['Resultado operacional', `<b class="${cls(d.res)}">${fmt(d.res)}</b>`, fmt(dPrev.res)], ['Margem líquida', pct(d.bruta ? d.res / d.bruta : 0), pct(dPrev.bruta ? dPrev.res / dPrev.bruta : 0)]])}</div>` : ''}
  <div class="grid2">
    <div class="card"><h2>Caixa e meios de pagamento</h2>${table(['Meio', N('Valor'), N('%')], meios)}
      <p class="muted">${difs.length ? `${difs.length} dia(s) com diferença acima da tolerância, somando ${fmt(sum(difs, c => cx(c).dif))}.` : 'Nenhuma diferença de caixa acima da tolerância.'}</p></div>
    <div class="card"><h2>Obrigações</h2>
      <p>Vencidas sem pagamento: <b class="${venc.length ? 'neg' : ''}">${venc.length} · ${fmt(sum(venc, p => p.valor))}</b></p>
      <p>A vencer nos próximos ${F.relTipo === 'mensal' ? '30' : '7'} dias: <b>${prox.length} · ${fmt(sum(prox, p => p.valor))}</b></p>
      <p>Aguardando autorização da direção: <b>${ab.filter(p => (p.valor || 0) > C.alcada && !p.autorizado).length}</b></p>
      <p>Divergências de recebimento em aberto: <b class="${div.length ? 'neg' : ''}">${div.length}</b></p></div>
  </div>
  <div class="card"><h2>Pendências</h2><p class="muted">${resolvidas.length} resolvida(s) no período · ${pend.length} em aberto</p>
    ${table(['Pendência', 'Responsável', 'Prazo'], pend.slice(0, 15).map(p => [esc(p.titulo), esc(p.responsavel || '—'), br(p.prazo)]))}</div>
  <div class="card"><h2>Análise e recomendações</h2>
    ${txt('analise', 'Análise do período', 'O que aconteceu, o que chamou atenção, causas das diferenças...')}
    ${txt('recomendacoes', 'Recomendações à direção', 'Ações propostas, decisões que precisam da aprovação da Sandra...')}
    ${txt('decisoes', 'Decisões tomadas', 'Preencher após a reunião com a direção')}
  </div>`;
};

/* ============================ CONFIGURAÇÕES ============================ */
function editarConfig() {
  const C = cfg();
  openForm({
    title: 'Parâmetros', data: { ...C, categoriasTxt: C.categorias.join('\n') },
    fields: [
      { k: 'saldoBanco', l: 'Saldo disponível atual (bancos + caixa)', type: 'money' }, { k: 'saldoBancoData', l: 'Data do saldo', type: 'date' },
      { k: 'tolerancia', l: 'Tolerância de diferença de caixa (R$/dia)', type: 'money' }, { k: 'alcada', l: 'Sua alçada para pagamentos sem autorização (R$)', type: 'money' },
      { k: 'taxaDebito', l: 'Taxa débito (%)', type: 'num' }, { k: 'prazoDebito', l: 'Prazo débito (dias)', type: 'num' },
      { k: 'taxaCredito', l: 'Taxa crédito (%)', type: 'num' }, { k: 'prazoCredito', l: 'Prazo crédito (dias)', type: 'num' },
      { k: 'taxaPix', l: 'Taxa PIX (%)', type: 'num' }, { k: 'prazoPix', l: 'Prazo PIX (dias)', type: 'num' },
      { k: 'cmvPercent', l: 'CMV estimado (% da receita)', type: 'num' }, { k: 'diasParado', l: 'Produto parado após (dias sem venda)', type: 'num' },
      { k: 'diasFechados', l: 'Dias em que a loja não abre (0=dom, 6=sáb, separados por vírgula)' },
      { k: 'diaPagFolha', l: 'Dia de pagamento dos salários (mês seguinte)', type: 'num' }, { k: 'diaInss', l: 'Dia de vencimento da guia de INSS (mês seguinte)', type: 'num' },
      { k: 'vendasEstimadas', l: 'Incluir vendas futuras estimadas no fluxo (média das últimas 4 semanas, já descontada a reposição de mercadoria)', type: 'check', full: 1 },
      { k: 'categoriasTxt', l: 'Categorias de despesa (uma por linha)', type: 'textarea', full: 1 }
    ],
    onSave: v => {
      const categorias = v.categoriasTxt.split('\n').map(s => s.trim()).filter(Boolean); delete v.categoriasTxt;
      return Store.save('config', { ...(S.config.find(x => x.id === 'geral') || {}), id: 'geral', ...v, categorias });
    }
  });
}
function editarOrcamento() {
  const C = cfg(), cats = C.categorias.filter(c => c !== 'Mercadoria');
  openForm({
    title: 'Orçamento mensal de despesas', data: Object.fromEntries(cats.map((c, i) => ['o' + i, C.orcamento[c] ?? null])),
    fields: cats.map((c, i) => ({ k: 'o' + i, l: c, type: 'money' })),
    preview: v => `Total orçado por mês: <b>${fmt(sum(Object.values(v), x => x))}</b>`,
    onSave: v => { const orcamento = {}; cats.forEach((c, i) => { if (v['o' + i]) orcamento[c] = v['o' + i]; }); return Store.save('config', { ...(S.config.find(x => x.id === 'geral') || {}), id: 'geral', orcamento }); }
  });
}
function exportar() {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backup-financeiro-sandra-${today()}.json`; a.click();
}
// Junta colaboradores e lançamentos semanais no documento do app de comissões (dados/principal),
// sem apagar o que já existe. Colaboradores são reconhecidos pelo primeiro nome.
async function importarComissoes(c) {
  const ref = db.collection('dados').doc('principal');
  const snap = await ref.get(); const st = snap.exists ? snap.data() : {};
  st.colaboradores = st.colaboradores || []; st.lancamentos = st.lancamentos || [];
  const chave = n => String(n || '').trim().split(/\s+/)[0].toLowerCase();
  let novos = 0, lancs = 0;
  for (const col of (c.colaboradores || [])) {
    const ex = st.colaboradores.find(x => chave(x.nome) === chave(col.nome));
    if (ex) { if (col.meta != null) ex.meta = col.meta; }
    else { st.colaboradores.push({ id: Date.now() + '' + novos, valorHE: 0, inss: 0, cafe: 0, tempo: 0, ...col }); novos++; }
  }
  for (const l of (c.lancamentos || [])) {
    const col = st.colaboradores.find(x => chave(x.nome) === chave(l.colNome)); if (!col) continue;
    st.lancamentos = st.lancamentos.filter(x => !(x.colId === col.id && x.dataIni === l.dataIni));
    st.lancamentos.push({ id: 'imp-' + col.id + '-' + l.dataIni, colId: col.id, nomeColab: col.nome, data: l.dataIni, dataIni: l.dataIni, dataFim: l.dataFim, vendas: l.vendas, meta: l.meta, vale: 0, faltasNum: 0, falta: false, obs: l.obs || '' });
    lancs++;
  }
  await ref.set(JSON.parse(JSON.stringify(st)));
  return { novos, lancs };
}
function importar(inp) {
  const f = inp.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    try {
      const d = JSON.parse(rd.result); let n = 0;
      if (!confirm('Importar este arquivo? Registros com o mesmo código serão substituídos (importar duas vezes não duplica).')) return;
      for (const c of COLS) for (const o of (d[c] || [])) { await Store.save(c, o); n++; }
      if (d.comissoes && !DEMO) {
        const r = await importarComissoes(d.comissoes);
        alert(`Importação concluída:\n• ${n} registros do financeiro\n• ${r.lancs} lançamento(s) semanais nas comissões\n• ${r.novos} colaborador(a)(es) novo(s)\n\nA página vai recarregar.`);
        location.reload(); return;
      }
      toast(n + ' registros importados');
    } catch (e) { alert('Arquivo inválido: ' + e.message); }
  };
  rd.readAsText(f);
}
R.config = () => {
  const C = cfg();
  const linhas = [['Saldo disponível', fmt(C.saldoBanco) + ' em ' + br(C.saldoBancoData)], ['Tolerância de caixa', fmt(C.tolerancia) + ' por dia'], ['Alçada de pagamento', fmt(C.alcada)],
  ['Débito', `${String(C.taxaDebito).replace('.', ',')}% · D+${C.prazoDebito}`], ['Crédito', `${String(C.taxaCredito).replace('.', ',')}% · D+${C.prazoCredito}`], ['PIX', `${String(C.taxaPix).replace('.', ',')}% · D+${C.prazoPix}`],
  ['CMV estimado', String(C.cmvPercent).replace('.', ',') + '%'], ['Produto parado após', C.diasParado + ' dias'], ['Vendas estimadas no fluxo', C.vendasEstimadas ? 'Sim' : 'Não']];
  const orc = Object.entries(C.orcamento).filter(([, v]) => v);
  return `
  <div class="grid2">
    <div class="card"><h2>Parâmetros</h2>${table(['Parâmetro', 'Valor'], linhas)}<div style="margin-top:12px"><button class="btn" onclick="editarConfig()">Editar parâmetros</button></div></div>
    <div class="card"><h2>Orçamento mensal</h2>${table(['Categoria', N('Valor')], orc.map(([k, v]) => [esc(k), fmt(v)]), orc.length ? ['Total', fmt(sum(orc, x => x[1]))] : null)}<div style="margin-top:12px"><button class="btn" onclick="editarOrcamento()">Editar orçamento</button></div></div>
  </div>
  <div class="card"><h2>Backup</h2><p class="muted">Baixe uma cópia de todos os dados uma vez por mês e guarde fora do sistema.</p>
    <div class="bar"><button class="btn sec" onclick="exportar()">Baixar backup</button><label class="btn sec">Importar backup ou lançamentos<input type="file" accept=".json" style="display:none" onchange="importar(this)"></label></div></div>
  <div class="card"><h2>Sobre</h2><p class="muted">${DEMO ? 'Modo demonstração (dados só neste navegador).' : 'Conectado ao Firebase (projeto ' + esc(firebaseConfig.projectId) + '). Dados em financeiro/loja.'}<br>No celular: abra o endereço no navegador e use "Adicionar à tela inicial" para ter o ícone como um aplicativo.</p></div>`;
};

/* ============================ LOGIN E INÍCIO ============================ */
function mostrarApp(email) {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('userInfo').textContent = email;
  Store.start();
}
async function entrar() {
  const e = document.getElementById('lgEmail').value, s = document.getElementById('lgSenha').value;
  document.getElementById('lgErro').textContent = '';
  try { await auth.signInWithEmailAndPassword(e, s); }
  catch (err) { document.getElementById('lgErro').textContent = 'Não foi possível entrar: ' + (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' ? 'e-mail ou senha incorretos.' : err.message); }
}
async function esqueciSenha() {
  const e = document.getElementById('lgEmail').value.trim().toLowerCase();
  if (!e) { document.getElementById('lgErro').textContent = 'Digite seu e-mail acima.'; return; }
  try { await auth.sendPasswordResetEmail(e); document.getElementById('lgErro').style.color = 'var(--ok)'; document.getElementById('lgErro').textContent = 'Link enviado para ' + e + ' (veja também o spam).'; }
  catch (err) { document.getElementById('lgErro').textContent = 'Não foi possível enviar: ' + (err.code || err.message); }
}
function sair() { if (DEMO) { toast('Modo demonstração: não há login.'); return; } auth.signOut().then(() => location.reload()); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

if (DEMO) {
  mostrarApp('Modo demonstração');
} else if (typeof firebase === 'undefined') {
  document.body.innerHTML = '<div style="padding:30px;font-family:sans-serif">Não foi possível carregar o Firebase. Verifique a conexão com a internet e recarregue a página.</div>';
} else {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth(); db = firebase.firestore();
  db.enablePersistence({ synchronizeTabs: true }).catch(() => { });
  auth.onAuthStateChanged(u => {
    if (u) mostrarApp(u.email);
    else { document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; }
  });
}
</script>
