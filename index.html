<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#251A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Sandra Acessórios e Presentes · Comissões e salários</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F4F7; --surface:#FFFFFF; --ink:#251A2B; --ink2:#5B5062; --ink3:#8E8494;
  --line:#E6E0E8; --line2:#D6CDD9; --plum:#6B2D5C; --plum2:#84406F; --plumbg:#F3E9F0;
  --jade:#0E7A66; --jadebg:#E3F3EF; --wine:#B23A48; --winebg:#F9E6E8; --amber:#9A6412; --amberbg:#FBF0DC;
  --r-s:6px; --r-m:10px; --r-l:16px; --side:248px;
  --money:"Fraunces", Georgia, serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.money{font-family:var(--money);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.pos{color:var(--jade)} .neg{color:var(--wine)} .muted{color:var(--ink3)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.015em}

/* ---------- Login ---------- */
#login{min-height:100vh;display:none;grid-template-columns:1fr 1fr}
#login .art{background:var(--ink);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
#login .art .marca{font-family:var(--money);font-size:44px;line-height:1.05}
#login .art .marca small{display:block;font-family:"Manrope";font-size:15px;opacity:.7;margin-top:10px;letter-spacing:0}
#login .art p{max-width:34ch;opacity:.75;margin:0}
#login form{align-self:center;justify-self:center;width:100%;max-width:360px;padding:32px 24px}
#login h1{font-size:24px;margin-bottom:6px}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-m);padding:11px 12px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--plum);box-shadow:0 0 0 3px var(--plumbg)}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
.msg{font-size:13px;margin-top:12px;min-height:20px}
.msg.err{color:var(--wine)} .msg.ok{color:var(--jade)}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r-m);padding:10px 16px;font-weight:700;cursor:pointer;background:var(--plum);color:#fff;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--plum2)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.sec:hover{background:var(--paper)}
.btn.ghost{background:transparent;color:var(--plum);padding:8px 10px}
.btn.ghost:hover{background:var(--plumbg)}
.btn.danger{background:var(--surface);color:var(--wine);border-color:var(--line2)}
.btn.danger:hover{background:var(--winebg)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:var(--r-s)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--plum);font-weight:600;cursor:pointer;padding:0}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--ink3);padding:6px;border-radius:var(--r-s);display:inline-flex}
.icon-btn:hover{background:var(--paper);color:var(--ink)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- Estrutura ---------- */
#app{display:none}
#side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:24px 14px 18px;z-index:20}
#side .marca{font-family:var(--money);font-size:24px;line-height:1.1;padding:0 10px}
#side .marca small{display:block;font-family:"Manrope";font-size:12px;opacity:.6;margin-top:4px}
#side nav{margin-top:28px;display:flex;flex-direction:column;gap:2px}
#side nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:rgba(255,255,255,.72);padding:10px 12px;border-radius:var(--r-m);cursor:pointer;font-weight:600}
#side nav button:hover{background:rgba(255,255,255,.07);color:#fff}
#side nav button.on{background:#fff;color:var(--ink)}
#side nav .grp{font-size:12px;opacity:.45;padding:18px 12px 6px}
#side .conta{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;opacity:.85}
#side .conta button{background:none;border:0;color:#fff;opacity:.7;cursor:pointer;padding:0;margin-top:4px;text-decoration:underline}
main{margin-left:var(--side);padding:32px 40px 80px;max-width:calc(1120px + var(--side))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head h1{font-size:26px}
.head p{margin:4px 0 0;color:var(--ink2);max-width:62ch}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:20px}
.panel+.panel{margin-top:16px}
.panel h2{font-size:16px;margin-bottom:4px}
.panel .sub{color:var(--ink3);font-size:13px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stack>*+*{margin-top:16px}

/* Números do mês: faixa única, não cartões soltos */
.faixa{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);margin-bottom:16px}
.faixa>div{padding:18px 20px}
.faixa>div+div{border-left:1px solid var(--line)}
.faixa .l{font-size:13px;color:var(--ink2);font-weight:600}
.faixa .v{font-size:28px;margin-top:4px}
.faixa .s{font-size:12px;color:var(--ink3)}

/* Tabelas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:700;color:var(--ink3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.act{text-align:right;white-space:nowrap}
.nc{display:none}
.pessoa{display:flex;align-items:center;gap:10px;font-weight:600}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:var(--jadebg);color:var(--jade)} .t-bad{background:var(--winebg);color:var(--wine)} .t-warn{background:var(--amberbg);color:var(--amber)} .t-mut{background:var(--paper);color:var(--ink3)}
.vazio{padding:28px 10px;text-align:center;color:var(--ink3)}
.vazio .btn{margin-top:12px}

/* Avisos */
.aviso{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-m);background:var(--amberbg);color:#5d3d09;margin-bottom:16px}
.aviso.ok{background:var(--jadebg);color:#0b4f42}
.aviso b{display:block}

/* ---------- Lançar semana ---------- */
.semana{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:4px}
.semana .lbl{padding:0 10px;font-weight:700;min-width:190px;text-align:center}
.folha{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.folha .linha{display:grid;grid-template-columns:minmax(180px,1.3fr) 1fr 1fr minmax(180px,1.2fr) 36px;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.folha .linha.cab{padding:10px 18px;font-size:12px;font-weight:700;color:var(--ink3);background:var(--paper)}
.folha .linha:last-child{border-bottom:0}
.folha .linha.salva{background:linear-gradient(90deg,var(--jadebg),transparent 40%)}
.folha .inp{padding:9px 10px}
.meta-bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.meta-bar i{display:block;height:100%;background:var(--plum);border-radius:8px;transition:width .25s}
.meta-bar i.bateu{background:var(--jade)}
.meta-txt{display:flex;justify-content:space-between;font-size:12px;margin-top:5px;color:var(--ink2)}
.meta-txt b{color:var(--ink)}
.folha .rodape{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 18px;background:var(--paper);flex-wrap:wrap}
.folha .mlbl{display:none}

/* ---------- Fechamento ---------- */
.holerite{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);margin-bottom:12px;overflow:hidden}
.holerite .topo{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
.holerite .topo .nome{flex:1;min-width:0}
.holerite .topo .nome b{display:block}
.holerite .topo .liq{text-align:right}
.holerite .topo .liq .money{font-size:24px}
.holerite .corpo{display:none;border-top:1px solid var(--line);padding:18px;grid-template-columns:1.2fr 1fr;gap:28px}
.holerite.aberto .corpo{display:grid}
.ln{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ln:last-child{border-bottom:0}
.ln.tot{border-top:2px solid var(--ink);border-bottom:0;margin-top:6px;padding-top:10px;font-weight:700}
.ln.tot .money{font-size:20px}
.bloco-t{font-size:13px;font-weight:700;color:var(--ink2);margin:14px 0 4px}
.bloco-t:first-child{margin-top:0}
.ajustes{background:var(--paper);border-radius:var(--r-m);padding:14px}
.ajustes .row3{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- Férias ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:12px;font-weight:700;color:var(--ink3);text-align:center;padding:4px 0}
.cal .d{min-height:64px;border-radius:var(--r-s);background:var(--paper);padding:6px;font-size:13px;position:relative}
.cal .d.fora{opacity:.35}
.cal .d.hoje{outline:2px solid var(--plum)}
.cal .d .chips{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.cal .d .chip{font-size:11px;font-weight:700;color:#fff;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;background:rgba(37,26,43,.45);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:48px 16px;overflow:auto}
#modal.on{display:flex}
#modal .box{background:var(--surface);border-radius:var(--r-l);width:100%;max-width:520px;padding:24px;box-shadow:0 20px 50px rgba(37,26,43,.25)}
#modal h2{font-size:19px}
#modal .desc{color:var(--ink2);margin:6px 0 4px}
#modal .acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fg .full{grid-column:1/-1}
.ajuda{font-size:12px;color:var(--ink3);margin-top:4px}
.toggle{display:flex;gap:10px;align-items:center;margin-top:16px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--plum)}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(37,26,43,.12)}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r-m);font-weight:600;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--wine)}
#carregando{position:fixed;inset:0;background:var(--paper);display:none;align-items:center;justify-content:center;z-index:90;flex-direction:column;gap:12px;color:var(--ink2)}
#carregando i{width:28px;height:28px;border:3px solid var(--line2);border-top-color:var(--plum);border-radius:50%;animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
#sync{font-size:12px;color:rgba(255,255,255,.55);margin-top:6px}

/* ---------- Celular ---------- */
#tabbar{display:none}
#mais{display:none}
@media (max-width:900px){
  #side{display:none}
  main{margin-left:0;padding:20px 16px 110px}
  .head h1{font-size:22px}
  .faixa{grid-template-columns:1fr 1fr}
  .faixa>div:nth-child(3){border-left:0}
  .faixa>div:nth-child(n+3){border-top:1px solid var(--line)}
  .faixa .v{font-size:22px}
  .grid2{grid-template-columns:1fr}
  #tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
  #tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink3);padding:6px 0;cursor:pointer}
  #tabbar button.on{color:var(--plum)}
  #tabbar button.lancar{color:#fff}
  #tabbar button.lancar span.bolha{background:var(--plum);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin-top:-18px;box-shadow:0 4px 12px rgba(107,45,92,.35)}
  #tabbar button.lancar span.t{color:var(--plum)}
  #mais.on{display:block;position:fixed;inset:0;background:rgba(37,26,43,.4);z-index:40}
  #mais .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
  #mais .sheet button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:14px 12px;font-weight:600;text-align:left;border-radius:var(--r-m);cursor:pointer}
  #mais .sheet button:hover{background:var(--paper)}
  .folha .linha.cab{display:none}
  .folha .linha{grid-template-columns:1fr 1fr;gap:10px;padding:16px}
  .folha .linha .quem{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
  .folha .linha .barra{grid-column:1/-1}
  .folha .linha .rm{display:none}
  .folha .mlbl{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:4px}
  .semana .lbl{min-width:0;font-size:14px}
  .holerite .corpo{grid-template-columns:1fr}
  .holerite .topo .liq .money{font-size:20px}
  .cal .d{min-height:46px;padding:4px}
  .cal .d .chip{font-size:0;height:6px;padding:0}
  #login{grid-template-columns:1fr}
  #login .art{padding:32px 24px;min-height:auto}
  #login .art .marca{font-size:32px}
  #login .art p{display:none}
  .fg{grid-template-columns:1fr}
  td.hide-m,th.hide-m{display:none}
  .nf{display:none} .nc{display:inline}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{#side,#tabbar,.tools,.btn{display:none!important}main{margin:0;padding:0}}
</style>
</head>
<body>

<div id="carregando"><i></i><span>Carregando dados…</span></div>

<!-- ======================= LOGIN ======================= -->
<section id="login">
  <div class="art">
    <div class="marca">Sandra<small>Acessórios e Presentes</small></div>
    <p>Comissões, salários e férias da equipe em um só lugar. Os dados ficam salvos na nuvem e aparecem no celular e no computador.</p>
  </div>
  <form onsubmit="event.preventDefault();entrar()">
    <h1>Entrar</h1>
    <div class="muted">Use o e-mail e a senha da sua conta.</div>
    <label class="field"><span>E-mail</span><input class="inp" id="lgEmail" type="email" autocomplete="username" required></label>
    <label class="field"><span>Senha</span><input class="inp" id="lgSenha" type="password" autocomplete="current-password" required></label>
    <button class="btn block" style="margin-top:20px" id="lgBtn">Entrar</button>
    <div class="msg" id="lgMsg"></div>
    <button type="button" class="link" onclick="esqueciSenha()">Esqueci a senha ou é meu primeiro acesso</button>
  </form>
</section>

<!-- ======================= APP ======================= -->
<div id="app">
  <aside id="side">
    <div class="marca">Sandra<small>Acessórios e Presentes</small></div>
    <nav id="nav"></nav>
    <div class="conta"><div id="contaEmail"></div><div id="sync">Tudo salvo</div><button onclick="sair()">Sair</button></div>
  </aside>
  <main id="main"></main>
  <nav id="tabbar"></nav>
  <div id="mais" onclick="if(event.target.id==='mais')fecharMais()"><div class="sheet" id="maisSheet"></div></div>
</div>

<div id="modal" onclick="if(event.target.id==='modal')fecharModal()"><div class="box" id="mbox" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* =====================================================================
   Sandra Acessórios e Presentes — Comissões e salários
   Dados: Firestore, documento dados/principal (mesmo formato da versão anterior)
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCNVD_PpYJ0yc1nnkMNwg80hJa9jhryIvk",
  authDomain: "salarios-sandra-acessorios.firebaseapp.com",
  projectId: "salarios-sandra-acessorios",
  storageBucket: "salarios-sandra-acessorios.firebasestorage.app",
  messagingSenderId: "929960542240",
  appId: "1:929960542240:web:d9e0b655f806aa27197c45"
};
const FAIXAS_COM_PADRAO = [{meta:85,com:0.4},{meta:90,com:0.5},{meta:100,com:1.0},{meta:120,com:1.5},{meta:130,com:2.0}];
const FAIXAS_BONUS_PADRAO = [{meta:100,bonus:25},{meta:120,bonus:37.5},{meta:130,bonus:100}];
const BACKUP_LOCAL = 'sandra_comissoes_v2';

let state = { colaboradores:[], lancamentos:[], descontosMes:{}, ferias:[], faixasCom:[], faixasBonus:[] };
let db = null, auth = null, docRef = null, unsub = null;
let salvando = null, pendente = false;

/* ============================ UTILIDADES ============================ */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje = () => iso(new Date());
const addDias = (s,n) => { const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); };
const diaSem = s => new Date(s+'T12:00:00').getDay();
const segunda = s => addDias(s, -((diaSem(s)+6)%7));
const br = s => s ? s.split('-').reverse().join('/') : '—';
const brCurto = s => s ? s.slice(8,10)+'/'+s.slice(5,7) : '—';
const mesAtual = () => hoje().slice(0,7);
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesNome = ym => { const [y,m]=ym.split('-'); return MESES[+m-1]+' de '+y; };
const mesNomeCap = ym => { const s=mesNome(ym); return s[0].toUpperCase()+s.slice(1); };
const somaMes = (ym,n) => { const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl = v => BRL.format(Number(v)||0);
const pct = v => (isFinite(v)?v:0).toFixed(0)+'%';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function num(v){
  if (typeof v==='number') return v;
  v=String(v??'').trim().replace(/[R$\s]/g,'');
  if (!v) return 0;
  if (v.includes(',')) v=v.replace(/\./g,'').replace(',','.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(v)) v=v.replace(/\./g,'');
  const n=parseFloat(v); return isNaN(n)?0:Math.round(n*100)/100;
}

/* ============================ CÁLCULOS ============================
   Mesmas regras da versão anterior:
   - cada lançamento é uma semana; a semana conta no mês em que COMEÇA
   - comissão = vendas × % da maior faixa atingida (vendas ÷ meta da semana)
   - bônus = valor fixo da maior faixa de bônus atingida
   - faltas = dias × (salário fixo ÷ 30)
   ================================================================== */
const EPS=1e-9;
function faixaCom(vendas,meta){ if(!meta||meta<=0) return null; const p=vendas/meta*100; return [...state.faixasCom].sort((a,b)=>b.meta-a.meta).find(f=>p>=f.meta-EPS)||null; }
function comissaoSemana(vendas,meta){ const f=faixaCom(vendas,meta); return f ? vendas*f.com/100 : 0; }
function bonusSemana(vendas,meta){ if(!meta||meta<=0) return 0; const p=vendas/meta*100; const f=[...state.faixasBonus].sort((a,b)=>b.meta-a.meta).find(f=>p>=f.meta-EPS); return f?Number(f.bonus):0; }
const inicioLanc = l => l.dataIni||l.data||'';
/* Escada de metas: Meta 1 = meta da semana; Meta 2 = Meta 1 + sobe2%; Meta 3 = Meta 2 + sobe3%.
   As faixas usadas no cálculo (faixasCom/faixasBonus, em % da Meta 1) são geradas a partir dela. */
const r4 = x => Math.round(x*1e4)/1e4;
function gatilhos(e){ const t2=r4(100*(1+e.sobe2/100)); return [100, t2, r4(t2*(1+e.sobe3/100))]; }
function aplicarEscada(s){
  const e=s.escada, t=gatilhos(e);
  s.faixasCom=[...e.abaixo.filter(f=>f.meta<100).map(f=>({meta:Number(f.meta),com:Number(f.com)})), ...e.niveis.map((n,i)=>({meta:t[i],com:Number(n.com)}))];
  s.faixasBonus=e.niveis.map((n,i)=>({meta:t[i],bonus:Number(n.bonus)})).filter(f=>f.bonus>0);
}
function metasReais(meta){ const t=gatilhos(state.escada); return t.map(x=>meta*x/100); }
function nivelAtingido(vendas,meta){ if(!meta) return 0; const p=vendas/meta*100, t=gatilhos(state.escada); let n=0; t.forEach((x,i)=>{ if(p>=x-EPS) n=i+1; }); return n; }
const lancsMes = (colId,ym) => state.lancamentos.filter(l=>l.colId===colId && inicioLanc(l).startsWith(ym));
function ajustes(colId,ym){ return state.descontosMes[colId+'_'+ym]||{}; }
function calcMes(colId,ym){
  const col=state.colaboradores.find(c=>c.id===colId); if(!col) return null;
  const ls=lancsMes(colId,ym);
  let comissao=0,bonus=0;
  ls.forEach(l=>{ comissao+=comissaoSemana(Number(l.vendas)||0,Number(l.meta)||0); bonus+=bonusSemana(Number(l.vendas)||0,Number(l.meta)||0); });
  const vendas=soma(ls,l=>l.vendas), metas=soma(ls,l=>l.meta), vale=soma(ls,l=>l.vale), faltasDias=soma(ls,l=>l.faltasNum);
  const fixo=Number(col.salario)||0, cafe=Number(col.cafe)||0, tempo=Number(col.tempo)||0, inss=Number(col.inss)||0;
  const a=ajustes(colId,ym);
  const horasExtras=Number(a.horasExtras)||0, valorHE=horasExtras*(Number(col.valorHE)||0);
  const valorDia=fixo/30, faltas=faltasDias*valorDia, outros=Number(a.outrosDescontos)||0;
  const base=fixo+comissao+bonus+valorHE+cafe+tempo;
  const liquido=base-inss-vale-faltas-outros;
  return {col,semanas:ls,vendas,metas,comissao,bonus,horasExtras,valorHE,cafe,tempo,fixo,inss,vale,faltasDias,valorDia,faltas,outros,outrosDesc:a.outrosDesc||'',base,liquido};
}
// Detalhe dos vales (um por data) e das datas de falta, para o holerite
function detalheDescontos(r){
  const ord=[...r.semanas].sort((a,b)=>inicioLanc(a).localeCompare(inicioLanc(b)));
  const vales=ord.filter(l=>Number(l.vale)>0).map(l=>({data: l.tipo ? br(inicioLanc(l)) : 'semana de '+brCurto(inicioLanc(l))+' a '+brCurto(l.dataFim), curta: l.tipo ? brCurto(inicioLanc(l)) : brCurto(inicioLanc(l))+' a '+brCurto(l.dataFim), valor:Number(l.vale), obs:l.obs&&l.tipo?l.obs:''}));
  const faltas=[]; ord.filter(l=>Number(l.faltasNum)>0).forEach(l=>{ if(l.tipo) faltas.push(brCurto(inicioLanc(l))); else faltas.push(l.faltasNum+' na semana de '+brCurto(inicioLanc(l))); });
  return {vales,faltas};
}
const ativos = () => state.colaboradores.filter(c=>c.ativo!==false);
function noMes(ym){ return state.colaboradores.filter(c=>c.ativo!==false || lancsMes(c.id,ym).length || state.descontosMes[c.id+'_'+ym]); }

/* ============================ DADOS ============================ */
function normalizar(s){
  s=s||{};
  s.colaboradores=s.colaboradores||[]; s.lancamentos=s.lancamentos||[]; s.descontosMes=s.descontosMes||{}; s.ferias=s.ferias||[];
  if(!s.faixasCom||!s.faixasCom.length) s.faixasCom=FAIXAS_COM_PADRAO.map(f=>({...f}));
  if(!s.faixasBonus||!s.faixasBonus.length) s.faixasBonus=FAIXAS_BONUS_PADRAO.map(f=>({...f}));
  if(!s.escada){
    // primeira vez: monta a escada a partir das faixas que já existiam
    const acima=[...s.faixasCom].filter(f=>f.meta>=100).sort((a,b)=>a.meta-b.meta);
    const bon=[...s.faixasBonus].filter(f=>f.meta>=100).sort((a,b)=>a.meta-b.meta);
    const padraoCom=[1,1.5,2], padraoBon=[25,37.5,50];
    s.escada={ sobe2:20, sobe3:30,
      niveis:[0,1,2].map(i=>({com:acima[i]?Number(acima[i].com):padraoCom[i], bonus:bon[i]?Number(bon[i].bonus):padraoBon[i]})),
      abaixo:s.faixasCom.filter(f=>f.meta<100).map(f=>({meta:Number(f.meta),com:Number(f.com)})) };
  }
  aplicarEscada(s);
  return s;
}
function statusSync(t){ const el=$('sync'); if(el) el.textContent=t; }
function salvar(){
  try{ localStorage.setItem(BACKUP_LOCAL, JSON.stringify(state)); }catch(e){}
  pendente=true; statusSync('Salvando…');
  clearTimeout(salvando);
  salvando=setTimeout(async()=>{
    try{
      await docRef.set(JSON.parse(JSON.stringify(state)));
      pendente=false; statusSync('Tudo salvo');
    }catch(e){
      console.error(e); statusSync('Não salvou');
      toast(e.code==='permission-denied' ? 'Sem permissão para salvar. Saia e entre de novo.' : 'Não foi possível salvar. Verifique a internet.', true);
    }
  },500);
}
function escutar(){
  $('carregando').style.display='flex';
  let primeiro=true;
  unsub=docRef.onSnapshot(snap=>{
    if(pendente || snap.metadata.hasPendingWrites){ if(primeiro){primeiro=false;$('carregando').style.display='none';} return; }
    state=normalizar(snap.exists?snap.data():{});
    try{ localStorage.setItem(BACKUP_LOCAL, JSON.stringify(state)); }catch(e){}
    if(primeiro){ primeiro=false; $('carregando').style.display='none'; }
    if(!$('modal').classList.contains('on') && !digitando()) render();
  }, err=>{
    console.error(err); $('carregando').style.display='none';
    toast(err.code==='permission-denied'?'Esta conta não tem acesso aos dados.':'Erro ao carregar os dados.', true);
  });
}

let MODAL=null;
function abrirModal({titulo, desc='', corpo='', ok='Salvar', cancelar='Cancelar', perigo=false, aoConfirmar, larg}){

/* ============================ INÍCIO ============================ */
function semanasDoMes(ym){
  // semanas (segunda a domingo) que começam no mês e já terminaram
  const res=[]; let d=segunda(ym+'-01'); if(d.slice(0,7)!==ym) d=addDias(d,7);
  while(d.slice(0,7)===ym){ const fim=addDias(d,6); if(fim<hoje()) res.push({ini:d,fim}); d=addDias(d,7); }
  return res;
}
function faltandoLancar(ym){
  const out=[];
  semanasDoMes(ym).forEach(s=>{
    const fora=c=>{ const ds=new Set(state.ferias.filter(f=>f.colId===c.id).flatMap(diasFerias)); let n=0; for(let i=0;i<7;i++) if(ds.has(addDias(s.ini,i))) n++; return n>=5; };
    const faltam=ativos().filter(c=>!fora(c) && !state.lancamentos.some(l=>!l.tipo && l.colId===c.id && inicioLanc(l)>=s.ini && inicioLanc(l)<=addDias(s.ini,6)));
    if(faltam.length) out.push({...s,faltam});
  });
  return out;
}

  const seg=segunda(hoje()); return addDias(seg,-7);

  const linhas=cols.map(c=>{

    return `<div class="linha ${l?'salva':''}" data-col="${c.id}">
      <div class="quem"><span class="pessoa">${av(c)}<span>${esc(c.nome)}${l?'<br><span class="tag t-ok" style="margin-top:3px">já lançado</span>':''}</span></span></div>
      <div><span class="mlbl">Vendas da semana</span><input class="inp num" inputmode="decimal" name="vendas" placeholder="0,00" value="${l?fmtInp(l.vendas):''}" aria-label="Vendas de ${esc(c.nome)}"></div>
      <div><span class="mlbl">Meta da semana</span><input class="inp num" inputmode="decimal" name="meta" placeholder="0,00" value="${fmtInp(meta)}" aria-label="Meta de ${esc(c.nome)}"></div>
      <div class="barra"></div>
      <div class="rm">${l?`<button type="button" class="icon-btn" title="Apagar o lançamento desta semana" onclick="apagarLanc('${l.id}')">${I.lixo}</button>`:''}</div>
    </div>`;
  }).join('');
  return `
  <div class="head"><div><h1>Lançar vendas</h1><p>Escolha a semana e preencha as vendas de cada vendedora. Quem não vendeu pode ficar em branco. A meta já vem do cadastro e pode ser trocada.</p></div></div>
  <div class="tools" style="margin-bottom:16px">
    <div class="semana"><button class="icon-btn" aria-label="Semana anterior" onclick="moverSemana(-1)">${I.esq}</button><span class="lbl">${brCurto(V.semIni)} a ${brCurto(V.semFim)}</span><button class="icon-btn" aria-label="Próxima semana" onclick="moverSemana(1)">${I.dir}</button></div>
    <button class="btn ghost" onclick="trocarDatas()">Trocar as datas</button>
    <span style="flex:1"></span>
    <button class="btn sec" onclick="formAvulso('vale')">Lançar vale</button>
    <button class="btn sec" onclick="formAvulso('falta')">Lançar falta</button>
  </div>
  <form class="folha" id="folha" onsubmit="event.preventDefault();salvarSemana()" oninput="previaFolha()">
    <div class="linha cab"><div>Vendedora</div><div style="text-align:right">Vendas</div><div style="text-align:right">Meta</div><div>Resultado</div><div></div></div>
    ${linhas}
    <div class="rodape"><div id="totFolha" class="muted"></div><button class="btn">Salvar semana</button></div>
  </form>
  <p class="muted" style="font-size:13px;margin-top:12px">Comissão e bônus seguem as <button class="link" onclick="ir('regras')">regras de comissão</button>.</p>
  ${painelAvulsos(V.semIni,V.semFim,'Vales e faltas desta semana')}`;
};
R.lancar_depois = () => previaFolha();
function previaFolha(){
  let tv=0,tc=0;
  document.querySelectorAll('#folha .linha[data-col]').forEach(row=>{
    const v=num(row.querySelector('[name=vendas]').value), m=num(row.querySelector('[name=meta]').value);
    tv+=v; const com=comissaoSemana(v,m)+bonusSemana(v,m); tc+=com;
    const mr=m?metasReais(m):null, nv=nivelAtingido(v,m);
    const prox = mr && nv<3 ? mr[nv] : null;
    const larg = !mr ? 0 : nv>=3 ? 100 : Math.min(100, (nv*100 + (v-(nv?mr[nv-1]:0))/(mr[nv]-(nv?mr[nv-1]:0))*100)/3);
    row.querySelector('.barra').innerHTML = !m ? '<span class="muted" style="font-size:13px">sem meta: sem comissão</span>' :
      !v ? `<span class="muted" style="font-size:13px">Metas: ${mr.map((x,i)=>(i+1)+'ª '+brl(x).replace(',00','')).join(' · ')}</span>` :
      `<div class="meta-bar" title="Metas: ${mr.map(x=>brl(x)).join(' / ')}"><i class="${nv?'bateu':''}" style="width:${Math.max(2,larg)}%"></i></div><div class="meta-txt"><span>${nv?nv+'ª meta batida':pct(v/m*100)+' da 1ª meta'}${prox?' · faltam '+brl(prox-v).replace(',00','')+' p/ '+(nv+1)+'ª':''}</span><b class="money">${brl(com)}</b></div>`;
  });
  $('totFolha').innerHTML=`Total da semana: <b class="money" style="color:var(--ink)">${brl(tv)}</b> em vendas · <b class="money pos">${brl(tc)}</b> em comissões e bônus`;
}
function trocarDatas(){
  abrirModal({titulo:'Datas da semana', desc:'Use quando a semana não for de segunda a domingo (feriado, semana quebrada).',
    corpo:`<div class="fg"><label class="field"><span>Início</span><input class="inp" type="date" name="ini" value="${V.semIni}" required></label><label class="field"><span>Fim</span><input class="inp" type="date" name="fim" value="${V.semFim}" required></label></div>`,
    ok:'Usar estas datas', aoConfirmar:f=>{ if(f.fim.value<f.ini.value){toast('A data final vem antes da inicial.',true);return false;} V.semIni=f.ini.value; V.semFim=f.fim.value; render(); }});
}
function salvarSemana(){
  let n=0, erros=[];
  document.querySelectorAll('#folha .linha[data-col]').forEach(row=>{
    const colId=row.dataset.col, col=state.colaboradores.find(c=>c.id===colId);
    const vendas=num(row.querySelector('[name=vendas]').value), meta=num(row.querySelector('[name=meta]').value);
    const ex=lancDaSemana(colId);
    const vale=ex?Number(ex.vale)||0:0, faltas=ex?Number(ex.faltasNum)||0:0;
    if(!vendas){ return; }
    if(vendas && !meta) erros.push(primeiroNome(col.nome));
    const reg={ id: ex?ex.id:uid(), colId, nomeColab:col.nome, data:V.semIni, dataIni:V.semIni, dataFim:V.semFim, vendas, meta, vale, faltasNum:faltas, falta:faltas>0, obs: ex?.obs||'' };
    if(ex) Object.assign(ex,reg); else state.lancamentos.push(reg);
    if(meta && !col.meta) col.meta=meta;
    n++;
  });
  if(!n){ toast('Preencha as vendas de pelo menos uma vendedora.',true); return; }
  salvar(); render();
  toast(`Semana salva: ${n} vendedora${n>1?'s':''}`);
  if(erros.length) setTimeout(()=>toast(`Sem meta (sem comissão): ${erros.join(', ')}`,true),2900);
}
function apagarLanc(id){
  const l=state.lancamentos.find(x=>x.id===id); if(!l) return;
  const c=state.colaboradores.find(x=>x.id===l.colId);
  const oque = l.tipo==='vale' ? `Vale de ${brl(l.vale)} para ${esc(c?.nome||l.nomeColab)} em ${br(inicioLanc(l))}.` : l.tipo==='falta' ? `Falta de ${esc(c?.nome||l.nomeColab)} em ${br(inicioLanc(l))}.` : `Vendas de ${esc(c?.nome||l.nomeColab)} na semana de ${br(inicioLanc(l))} (${brl(l.vendas)}).`;
  confirmar('Apagar lançamento?', oque+' Isso não pode ser desfeito.', 'Apagar', ()=>{
    state.lancamentos=state.lancamentos.filter(x=>x.id!==id); salvar(); render(); toast('Lançamento apagado');
  });
}
function editarLanc(id){
  const l=state.lancamentos.find(x=>x.id===id); if(!l) return;
  if(l.tipo) return formAvulso(l.tipo,id);
  const c=state.colaboradores.find(x=>x.id===l.colId);
  abrirModal({titulo:'Editar lançamento', desc:esc(c?.nome||l.nomeColab),
    corpo:`<div class="fg">
      <label class="field"><span>Início da semana</span><input class="inp" type="date" name="ini" value="${inicioLanc(l)}" required></label>
      <label class="field"><span>Fim da semana</span><input class="inp" type="date" name="fim" value="${l.dataFim||inicioLanc(l)}" required></label>
      <label class="field"><span>Vendas</span><input class="inp num" inputmode="decimal" name="vendas" value="${fmtInp(l.vendas)}"></label>
      <label class="field"><span>Meta da semana</span><input class="inp num" inputmode="decimal" name="meta" value="${fmtInp(l.meta)}"></label>
      <label class="field"><span>Vale</span><input class="inp num" inputmode="decimal" name="vale" value="${fmtInp(l.vale)}"></label>
      <label class="field"><span>Faltas (dias)</span><input class="inp num" inputmode="numeric" name="faltas" value="${l.faltasNum||''}"></label>
      <label class="field full"><span>Observação</span><input class="inp" name="obs" value="${esc(l.obs||'')}"></label></div>`,
    aoConfirmar:f=>{
      if(f.fim.value<f.ini.value){toast('A data final vem antes da inicial.',true);return false;}
      const fl=Math.max(0,Math.round(num(f.faltas.value)));
      Object.assign(l,{data:f.ini.value,dataIni:f.ini.value,dataFim:f.fim.value,vendas:num(f.vendas.value),meta:num(f.meta.value),vale:num(f.vale.value),faltasNum:fl,falta:fl>0,obs:f.obs.value.trim()});
      salvar(); render(); toast('Lançamento atualizado');
    }});
}

/* ============================ VALE E FALTA EM UMA DATA ============================ */
function avulsosEntre(ini,fim){ return state.lancamentos.filter(l=>l.tipo && inicioLanc(l)>=ini && inicioLanc(l)<=fim).sort((a,b)=>inicioLanc(a).localeCompare(inicioLanc(b))); }
function painelAvulsos(ini,fim,titulo){
  const ls=avulsosEntre(ini,fim);
  return `<div class="panel" style="margin-top:16px"><h2>${titulo}</h2><p class="sub">Vales e faltas são descontados no fechamento do mês da data lançada.</p>
    ${ls.length?`<div class="tw"><table><tbody>${ls.map(l=>{ const c=state.colaboradores.find(x=>x.id===l.colId)||{id:l.colId,nome:l.nomeColab||'?'};
      return `<tr><td>${brCurto(inicioLanc(l))}</td><td><span class="pessoa">${av(c)}${nomeR(c)}</span></td><td>${l.tipo==='vale'?'<span class="tag t-warn">Vale</span>':'<span class="tag t-bad">Falta</span>'}${l.obs?` <span class="muted" style="font-size:13px">${esc(l.obs)}</span>`:''}</td>
      <td class="n money">${l.tipo==='vale'?brl(l.vale):''}</td><td class="act"><button class="icon-btn" title="Editar" onclick="formAvulso('${l.tipo}','${l.id}')">${I.editar}</button><button class="icon-btn" title="Apagar" onclick="apagarLanc('${l.id}')">${I.lixo}</button></td></tr>`; }).join('')}</tbody></table></div>`
     :'<div class="muted" style="font-size:14px">Nenhum vale ou falta lançado nestes dias.</div>'}</div>`;
}
function formAvulso(tipo,id){
  const l=id?state.lancamentos.find(x=>x.id===id):null;
  const cols=state.colaboradores.filter(c=>c.ativo!==false || (l&&l.colId===c.id));
  if(!cols.length){ toast('Cadastre a equipe primeiro.',true); return; }
  const dataPadrao = l?inicioLanc(l) : (hoje()>=V.semIni && hoje()<=V.semFim ? hoje() : V.semIni||hoje());
  const vale = tipo==='vale';
  abrirModal({titulo: (id?'Editar ':'Lançar ')+(vale?'vale':'falta'),
    desc: vale?'Valor adiantado em uma data. É descontado do salário no fechamento do mês.':'Um dia de falta. É descontado no fechamento do mês (salário fixo ÷ 30 por dia).',
    corpo:`<label class="field"><span>Pessoa</span><select class="inp" name="col">${cols.map(c=>`<option value="${c.id}" ${l&&l.colId===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label>
      <div class="fg"><label class="field"><span>Data</span><input class="inp" type="date" name="data" value="${dataPadrao}" required></label>
      ${vale?`<label class="field"><span>Valor do vale</span><input class="inp num" inputmode="decimal" name="valor" value="${l?fmtInp(l.vale):''}" placeholder="0,00" required></label>`:''}</div>
      <label class="field"><span>Observação</span><input class="inp" name="obs" value="${esc(l?.obs||'')}" placeholder="${vale?'ex.: adiantamento pedido no caixa':'ex.: atestado, sem justificativa'}"></label>`,
    ok: id?'Salvar':(vale?'Lançar vale':'Lançar falta'),
    aoConfirmar:f=>{
      const colId=f.col.value, col=state.colaboradores.find(c=>c.id===colId), d=f.data.value;
      const valor=vale?num(f.valor.value):0;
      if(vale && !valor){ toast('Informe o valor do vale.',true); return false; }
      if(!vale && state.lancamentos.some(x=>x.tipo==='falta' && x.colId===colId && inicioLanc(x)===d && x.id!==id)){ toast('Já existe uma falta dela nesta data.',true); return false; }
      const reg={id:id||uid(),tipo,colId,nomeColab:col.nome,data:d,dataIni:d,dataFim:d,vendas:0,meta:0,vale:valor,faltasNum:vale?0:1,falta:!vale,obs:f.obs.value.trim()};
      if(id) state.lancamentos=state.lancamentos.map(x=>x.id===id?reg:x); else state.lancamentos.push(reg);
      salvar(); render(); toast(vale?(id?'Vale atualizado':'Vale lançado'):(id?'Falta atualizada':'Falta lançada'));
    }});
}

/* ============================ FECHAMENTO DO MÊS ============================ */

          <div class="bloco-t">Descontos</div>

function salvarAjustes(colId,f){
  state.descontosMes[colId+'_'+V.mes]={horasExtras:num(f.he.value),outrosDescontos:num(f.outros.value),outrosDesc:f.motivo.value.trim()};
  salvar(); render(); toast('Ajustes salvos');
}

/* ============================ PDF ============================ */
function pdfHolerite(ids){
  if(!window.jspdf){ toast('O gerador de PDF ainda não carregou. Tente de novo em instantes.',true); return; }
  const {jsPDF}=window.jspdf, ym=V.mes, doc=new jsPDF({unit:'mm',format:'a4'});
  const PW=210, ML=18, MR=192; const tira=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'');
  const real=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  ids.forEach((id,idx)=>{
    const r=calcMes(id,ym); if(!r) return;
    if(idx) doc.addPage();
    doc.setFillColor(37,26,43); doc.rect(0,0,PW,26,'F');
    doc.setTextColor(255,255,255); doc.setFont('times','bold'); doc.setFontSize(18); doc.text('Sandra',ML,15);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.text('Acessorios e Presentes',ML,20.5);
    doc.setFontSize(10); doc.text('Holerite de '+tira(mesNome(ym)),MR,15,{align:'right'});
    let y=38;
    doc.setTextColor(37,26,43); doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(tira(r.col.nome),ML,y);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(110,100,115);
    doc.text(`${r.semanas.filter(l=>!l.tipo).length} semana(s) lancada(s)  |  vendas no mes: ${real(r.vendas)}`,ML,y+5.5); y+=14;
    const sec=t=>{ doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(107,45,92); doc.text(t,ML,y); y+=5.5; };
    const ln=(a,b,neg)=>{ doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(60,50,65); doc.text(tira(a),ML,y); doc.setTextColor(neg?178:37,neg?58:26,neg?72:43); doc.text((neg?'- ':'')+real(b),MR,y,{align:'right'}); doc.setDrawColor(230,224,232); doc.setLineWidth(0.2); doc.line(ML,y+2,MR,y+2); y+=7; };
    sec('A RECEBER'); ln('Salario fixo',r.fixo); ln('Comissoes',r.comissao); ln('Bonus por meta',r.bonus);
    if(r.valorHE) ln(`Horas extras (${r.horasExtras} h)`,r.valorHE); if(r.cafe) ln('Cafe',r.cafe); if(r.tempo) ln('Bonus por tempo de casa',r.tempo);
    y+=3; sec('DESCONTOS'); ln('INSS',r.inss,true); const dd=detalheDescontos(r); dd.vales.forEach(v=>ln('Vale em '+v.data+(v.obs?' ('+v.obs+')':''),v.valor,true)); if(r.faltas) ln(`Faltas (${r.faltasDias} dia(s): ${dd.faltas.join(', ')})`,r.faltas,true); if(r.outros) ln('Outros'+(r.outrosDesc?' ('+r.outrosDesc+')':''),r.outros,true);
    y+=2; doc.setFillColor(243,233,240); doc.rect(ML,y-5,MR-ML,11,'F');

/* ============================ FÉRIAS ============================ */
function diasFerias(f){
  if(f.tipo==='periodo'){ const out=[]; for(let d=f.inicio; d<=f.fim; d=addDias(d,1)) out.push(d); return out; }
  return f.datas||[];
}
R.ferias = () => {
  const ano=V.ferAno, mes=V.ferMes, ym=ano+'-'+pad(mes+1);
  const mapa={}; state.ferias.forEach(f=>diasFerias(f).forEach(d=>{ if(d.startsWith(ym)) (mapa[d]=mapa[d]||[]).push(f); }));
  const primeiro=new Date(ano,mes,1).getDay(), total=new Date(ano,mes+1,0).getDate();
  let cel='';
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(d=>cel+=`<div class="dow">${d}</div>`);
  for(let i=0;i<primeiro;i++) cel+=`<div class="d fora"></div>`;
  for(let d=1;d<=total;d++){ const k=ym+'-'+pad(d); const fs=mapa[k]||[];
    cel+=`<div class="d ${k===hoje()?'hoje':''}" title="${esc(fs.map(f=>(state.colaboradores.find(c=>c.id===f.colId)?.nome||f.nomeColab)).join(', '))}">${d}<div class="chips">${fs.slice(0,3).map(f=>{const c=state.colaboradores.find(x=>x.id===f.colId);return `<span class="chip" style="background:${corDe(f.colId)}">${esc(primeiroNome(c?.nome||f.nomeColab))}</span>`;}).join('')}</div></div>`; }
  const doAno=state.colaboradores.map(c=>({c,dias:new Set(state.ferias.filter(f=>f.colId===c.id).flatMap(diasFerias).filter(d=>d.startsWith(String(ano)))).size})).filter(x=>x.dias);
  const lista=[...state.ferias].sort((a,b)=>(diasFerias(b)[0]||'').localeCompare(diasFerias(a)[0]||'')).map(f=>{
    const c=state.colaboradores.find(x=>x.id===f.colId)||{id:f.colId,nome:f.nomeColab||'?'}; const ds=diasFerias(f);
    const per=f.tipo==='periodo'?`${br(f.inicio)} a ${br(f.fim)}`:ds.map(brCurto).join(', ');
    return `<tr><td><span class="pessoa">${av(c)}${esc(c.nome)}</span></td><td>${per}${f.obs?`<div class="muted" style="font-size:13px">${esc(f.obs)}</div>`:''}</td><td class="n">${ds.length} dia${ds.length!==1?'s':''}</td>
      <td class="act"><button class="icon-btn" title="Editar" onclick="formFerias('${f.id}')">${I.editar}</button><button class="icon-btn" title="Apagar" onclick="apagarFerias('${f.id}')">${I.lixo}</button></td></tr>`;
  }).join('');
  return `
  <div class="head"><div><h1>Férias</h1><p>Marque férias, folgas e afastamentos para saber quem está fora em cada dia.</p></div>
    <div class="tools"><button class="btn" onclick="formFerias()">${I.lancar}Marcar férias ou folga</button></div></div>
  <div class="grid2" style="grid-template-columns:1.4fr 1fr">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2>${MESES[mes][0].toUpperCase()+MESES[mes].slice(1)} de ${ano}</h2>
        <div class="semana"><button class="icon-btn" aria-label="Mês anterior" onclick="navFer(-1)">${I.esq}</button><button class="icon-btn" aria-label="Próximo mês" onclick="navFer(1)">${I.dir}</button></div></div>
      <div class="cal">${cel}</div>
    </div>
    <div class="panel"><h2>Dias fora em ${ano}</h2><p class="sub">Soma de todos os registros do ano.</p>
      ${doAno.length?`<table><tbody>${doAno.map(x=>`<tr><td><span class="pessoa">${av(x.c)}${esc(x.c.nome)}</span></td><td class="n"><b>${x.dias}</b> dia${x.dias!==1?'s':''}</td></tr>`).join('')}</tbody></table>`:'<div class="vazio">Nenhum registro neste ano.</div>'}
    </div>
  </div>
  <div class="panel" style="margin-top:16px"><h2>Registros</h2>
    ${lista?`<div class="tw"><table><thead><tr><th>Pessoa</th><th>Período</th><th class="n">Dias</th><th></th></tr></thead><tbody>${lista}</tbody></table></div>`:'<div class="vazio">Nada marcado ainda.</div>'}</div>`;
};

      else { const ds=fm.datas.value.split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean).map(s=>{const p=s.split('/'); return p.length===3?`${p[2].length===2?'20'+p[2]:p[2]}-${pad(p[1])}-${pad(p[0])}`:s;}).filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s));
        if(!ds.length){toast('Informe pelo menos uma data no formato dd/mm/aaaa.',true);return false;} reg.datas=[...new Set(ds)].sort(); }
      if(id) state.ferias=state.ferias.map(x=>x.id===id?reg:x); else state.ferias.push(reg);

function apagarFerias(id){ confirmar('Apagar registro de férias?','O registro sai do calendário. Isso não pode ser desfeito.','Apagar',()=>{ state.ferias=state.ferias.filter(f=>f.id!==id); salvar(); render(); toast('Registro apagado'); }); }

    <div class="panel"><h2>Abaixo da 1ª meta</h2><p class="sub">Comissão para quem chega perto da 1ª meta, sem bônus. Deixe vazio se não houver.</p>
      ${abaixo.length?`<table><tbody>${abaixo.map(f=>`<tr><td>${String(f.meta).replace('.',',')}% da 1ª meta (${brl(ex*f.meta/100)} no exemplo)</td><td class="n"><b>${String(f.com).replace('.',',')}%</b></td><td class="act"><button class="icon-btn" title="Remover" onclick="remAbaixo(${f.meta})">${I.lixo}</button></td></tr>`).join('')}</tbody></table>`:'<div class="muted" style="font-size:14px">Nenhuma comissão abaixo da 1ª meta.</div>'}
      <form style="display:flex;gap:8px;margin-top:14px;align-items:flex-end;flex-wrap:wrap" onsubmit="event.preventDefault();addAbaixo(this)">
        <label class="field" style="flex:1;margin:0"><span>% da 1ª meta</span><input class="inp num" name="a" inputmode="decimal" placeholder="90"></label>
        <label class="field" style="flex:1;margin:0"><span>% de comissão</span><input class="inp num" name="b" inputmode="decimal" placeholder="0,5"></label>
        <button class="btn sec">Adicionar</button></form></div>
    <div class="panel"><h2>Simular uma semana</h2><p class="sub">Digite as vendas e a 1ª meta.</p>
      <form style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end" oninput="simular(this)" onsubmit="event.preventDefault()">
        <label class="field" style="margin:0;flex:1;min-width:120px"><span>Vendas</span><input class="inp num" name="v" inputmode="decimal" placeholder="0,00"></label>
        <label class="field" style="margin:0;flex:1;min-width:120px"><span>1ª meta</span><input class="inp num" name="m" inputmode="decimal" placeholder="0,00"></label></form>
      <div id="simOut" style="margin-top:14px" class="muted">—</div></div>
  </div>`;
};
function lerEscada(f){ return { sobe2:num(f.s2.value), sobe3:num(f.s3.value), niveis:[0,1,2].map(i=>({com:num(f['c'+i].value), bonus:num(f['b'+i].value)})), abaixo:state.escada.abaixo }; }
function previaEscada(f){ const t=gatilhos(lerEscada(f)); t.forEach((x,i)=>{ const el=$('ex'+i); if(el) el.textContent=brl(10000*x/100); }); }
function salvarEscada(f){
  const e=lerEscada(f);
  if(e.sobe2<=0||e.sobe3<=0){ toast('O aumento da 2ª e da 3ª meta precisa ser maior que zero.',true); return; }
  if(e.niveis.some(n=>!n.com)){ toast('Informe a comissão das três metas.',true); return; }
  state.escada=e; aplicarEscada(state); salvar(); render(); toast('Regras salvas');
}
function addAbaixo(f){ const a=num(f.a.value), b=num(f.b.value); if(!a||!b){toast('Preencha os dois campos.',true);return;} if(a>=100){toast('Use um valor abaixo de 100% (a 1ª meta já tem a própria comissão).',true);return;}
  state.escada.abaixo=state.escada.abaixo.filter(x=>x.meta!==a); state.escada.abaixo.push({meta:a,com:b}); aplicarEscada(state); salvar(); render(); toast('Faixa salva'); }
function remAbaixo(meta){ confirmar('Remover a faixa de '+String(meta).replace('.',',')+'%?','As semanas já lançadas são recalculadas sem essa faixa.','Remover',()=>{ state.escada.abaixo=state.escada.abaixo.filter(x=>x.meta!==meta); aplicarEscada(state); salvar(); render(); toast('Faixa removida'); }); }
function simular(f){ const v=num(f.v.value), m=num(f.m.value); if(!v||!m){$('simOut').textContent='—';return;}
  const mr=metasReais(m), nv=nivelAtingido(v,m), c=comissaoSemana(v,m), b=bonusSemana(v,m), fx=faixaCom(v,m);
  $('simOut').innerHTML=`Metas: ${mr.map((x,i)=>(i+1)+'ª '+brl(x)).join(' · ')}<br>${nv?`Bateu a <b>${nv}ª meta</b>`:fx?`Chegou a ${pct(v/m*100)} da 1ª meta`:'Não chegou à 1ª meta'}: ${fx?String(fx.com).replace('.',',')+'% de '+brl(v):'sem comissão'}<br><b class="money pos" style="font-size:20px">${brl(c+b)}</b> <span class="muted">(${brl(c)} de comissão + ${brl(b)} de bônus)</span>`; }

/* ============================ MINHA CONTA ============================ */
R.conta = () => `
  <div class="head"><div><h1>Minha conta</h1></div></div>
  <div class="grid2">
    <div class="panel"><h2>Acesso</h2><p class="sub">Você está usando a conta <b>${esc(auth?.currentUser?.email||'')}</b>.</p>
      <button class="btn sec" onclick="trocarSenha()">Receber e-mail para trocar a senha</button>
      <button class="btn ghost" style="margin-left:4px" onclick="sair()">Sair</button></div>
    <div class="panel"><h2>Cópia de segurança</h2><p class="sub">Baixa um arquivo com todos os dados (equipe, lançamentos, ajustes, férias e regras). Guarde uma vez por mês.</p>
      <button class="btn sec" onclick="baixarBackup()">${I.pdf}Baixar cópia</button></div>
  </div>`;
function baixarBackup(){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:'application/json'})); a.download='comissoes-sandra-'+hoje()+'.json'; a.click(); toast('Cópia baixada'); }
async function trocarSenha(){ try{ await auth.sendPasswordResetEmail(auth.currentUser.email); toast('Enviamos o link para '+auth.currentUser.email); }catch(e){ toast('Não foi possível enviar o e-mail.',true); } }

/* ============================ LOGIN ============================ */
function msgLogin(t,tipo){ const m=$('lgMsg'); m.textContent=t; m.className='msg '+(tipo||''); }
async function entrar(){
  const e=$('lgEmail').value.trim().toLowerCase(), s=$('lgSenha').value; $('lgBtn').disabled=true; msgLogin('');
  try{ await auth.signInWithEmailAndPassword(e,s); }
  catch(err){ const c=err.code||''; msgLogin(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)?'E-mail ou senha incorretos.':c==='auth/too-many-requests'?'Muitas tentativas. Aguarde alguns minutos.':c==='auth/network-request-failed'?'Sem conexão com a internet.':'Não foi possível entrar.','err'); }
  $('lgBtn').disabled=false;
}
async function esqueciSenha(){
  const e=$('lgEmail').value.trim().toLowerCase(); if(!e){ msgLogin('Digite seu e-mail no campo acima e clique de novo.','err'); $('lgEmail').focus(); return; }
  try{ await auth.sendPasswordResetEmail(e); msgLogin('Enviamos um link para '+e+'. Veja também a caixa de spam.','ok'); }
  catch(err){ msgLogin('Não foi possível enviar o e-mail para esse endereço.','err'); }
}
function sair(){ fecharMais(); if(unsub) unsub(); auth.signOut().then(()=>location.reload()); }

/* ============================ INÍCIO ============================ */
(function iniciar(){
  if(typeof firebase==='undefined'){ document.body.innerHTML='<p style="padding:32px;font-family:sans-serif">Não foi possível carregar o sistema. Verifique a internet e recarregue a página.</p>'; return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth(); db=firebase.firestore(); docRef=db.collection('dados').doc('principal');
  const h=(location.hash||'').slice(1); if(PAGS.some(p=>p.id===h)) pag=h;
  auth.onAuthStateChanged(u=>{
    if(u){ $('login').style.display='none'; $('app').style.display='block'; $('contaEmail').textContent=u.email; escutar(); }
    else { $('app').style.display='none'; $('login').style.display='grid'; }
  });
  window.addEventListener('beforeunload',e=>{ if(pendente){ e.preventDefault(); e.returnValue=''; } });
})();
</script>
